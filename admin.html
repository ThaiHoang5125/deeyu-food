<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Deeyu Food – Quản trị dữ liệu</title>
<link rel="icon" type="image/png" href="img/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg:#f7f4ef; --card:#fff; --ink:#1f1a14; --ink2:#4a4037; --mute:#74685a; --line:#ece5dc; --line2:#d9cfc2; --sunk:#f3eee7;
    --brand:#1b0e5e; --brand-l:#3f3291; --brand2:#eeecf8; --brand3:#dcd8f0;
    --ok:#237a35; --ok2:#e7f6ea; --warn:#9a4a00; --warn2:#fff4e6; --bad:#c92a2a; --bad2:#ffeded; --info:#1864ab; --info2:#e7f3ff;
    --r:14px; --sh:0 1px 2px rgba(31,26,20,.05), 0 4px 14px rgba(31,26,20,.05);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Be Vietnam Pro", system-ui, sans-serif; }
  button, input { font:inherit; color:inherit; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px 48px; }
  header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header .in { max-width:1100px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; }
  header img { width:34px; height:34px; border-radius:9px; }
  header h1 { font-size:17px; margin:0; flex:1; letter-spacing:-.2px; }
  header h1 small { display:block; font-weight:500; font-size:12px; color:var(--mute); letter-spacing:0; }
  .btn { border:1px solid var(--line2); background:#fff; border-radius:10px; padding:7px 12px; cursor:pointer; font-weight:600; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { background:var(--sunk); }
  .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.primary:hover { background:var(--brand-l); }
  .btn:disabled { opacity:.55; cursor:default; }

  .login { max-width:360px; margin:12vh auto 0; background:#fff; border-radius:var(--r); box-shadow:var(--sh); padding:26px 22px; text-align:center; }
  .login img { width:56px; height:56px; border-radius:14px; }
  .login h2 { margin:10px 0 4px; font-size:19px; }
  .login p { margin:0 0 16px; color:var(--mute); font-size:13.5px; }
  .login input { width:100%; padding:12px 14px; border:1.5px solid var(--line2); border-radius:12px; background:#fff; margin-bottom:10px; outline:none; }
  .login input:focus { border-color:var(--brand-l); box-shadow:0 0 0 4px rgba(27,14,94,.12); }
  .login .btn { width:100%; justify-content:center; padding:11px; }
  .err { color:var(--bad); font-size:13.5px; min-height:20px; margin-top:8px; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:18px 0; }
  .stat { background:#fff; border-radius:var(--r); box-shadow:var(--sh); padding:14px 16px; }
  .stat span { display:block; font-size:12.5px; color:var(--mute); font-weight:500; }
  .stat b { font-size:24px; letter-spacing:-.5px; }
  .stat.bad b { color:var(--bad); } .stat.ok b { color:var(--ok); } .stat.info b { color:var(--info); }
  .stat small { display:inline; font-weight:400; font-size:11.5px; }
  .money { padding:14px 16px; margin-bottom:18px; overflow:visible; }
  .money h2 { margin:0; font-size:15px; } .money h2 small { font-weight:500; font-size:12.5px; color:var(--mute); margin-left:6px; }
  .stats.flat { margin:10px 0 0; } .stats.flat .stat { box-shadow:none; background:var(--sunk); }
  .money .prog { margin-top:12px; }

  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .tabs { display:flex; gap:4px; background:var(--sunk); padding:4px; border-radius:13px; overflow-x:auto; flex:1 1 auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { border:0; background:transparent; padding:8px 13px; border-radius:10px; font-weight:600; color:var(--mute); cursor:pointer; white-space:nowrap; font-size:14px; }
  .tabs button.on { background:#fff; color:var(--brand); box-shadow:0 1px 3px rgba(31,26,20,.12); }
  .tabs .n { font-size:11.5px; background:var(--line); border-radius:99px; padding:1px 7px; margin-left:5px; color:var(--ink2); }
  .tabs button.on .n { background:var(--brand2); color:var(--brand); }
  .search { flex:1 1 220px; max-width:340px; }
  .search input { width:100%; padding:9px 13px; border:1.5px solid var(--line2); border-radius:11px; background:#fff; outline:none; }
  .search input:focus { border-color:var(--brand-l); box-shadow:0 0 0 4px rgba(27,14,94,.12); }

  .tag { display:inline-block; font-size:12px; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--sunk); color:var(--mute); white-space:nowrap; }
  .tag.ok { background:var(--ok2); color:var(--ok); } .tag.bad { background:var(--bad2); color:var(--bad); }
  .tag.info { background:var(--info2); color:var(--info); } .tag.warn { background:var(--warn2); color:var(--warn); } .tag.brand { background:var(--brand2); color:var(--brand); }
  .mute { color:var(--mute); } .small { font-size:13px; } .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }

  .card { background:#fff; border-radius:var(--r); box-shadow:var(--sh); overflow:hidden; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--mute); font-weight:700; padding:11px 14px; background:var(--sunk); white-space:nowrap; position:sticky; top:0; }
  td { padding:10px 14px; border-top:1px solid var(--line); vertical-align:top; }
  tbody tr:hover td { background:#fbf9f6; }
  td.wrap2 { min-width:180px; max-width:360px; white-space:pre-line; }
  .empty { padding:36px; text-align:center; color:var(--mute); }

  .sess { padding:14px 16px; border-top:1px solid var(--line); cursor:pointer; }
  .sess:first-child { border-top:0; }
  .sess:hover { background:#fbf9f6; }
  .sess .top { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sess .top b { font-size:15.5px; flex:1 1 180px; }
  .sess .meta { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--mute); margin-top:3px; }
  .prog { height:6px; border-radius:6px; background:var(--line); margin-top:9px; overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--ok); border-radius:6px; }
  .detail { margin-top:12px; background:var(--sunk); border-radius:12px; padding:6px 14px; cursor:default; }
  .person { padding:10px 0; border-top:1px solid var(--line2); }
  .person:first-child { border-top:0; }
  .person .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .person .row b { flex:1 1 140px; }
  .line { font-size:13.5px; color:var(--ink2); margin:3px 0 0 0; }
  .grp { margin-bottom:18px; }
  .grp-h { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:2px 4px 8px; }
  .grow { flex:1 1 260px; }
  .foot { text-align:center; color:var(--mute); font-size:12.5px; margin-top:16px; }
  .hidden { display:none !important; }
  @media (max-width:640px) { th, td { padding:9px 10px; } header h1 small { display:none; } }
.mini{padding:2px 8px;font-size:12px;margin-left:4px}.mini.del{color:var(--bad)}
  body:not(.edit) [data-act], body:not(.edit) [data-edit] { display:none !important; }
  .btn.on { background:var(--warn2); border-color:var(--warn); color:var(--warn); }
  dialog { border:1px solid var(--line2); border-radius:var(--r); padding:16px; width:min(600px,94vw); background:#fff; color:var(--ink); max-height:92vh; overflow:auto; }
  dialog::backdrop { background:rgba(31,26,20,.45); }
  .dbody { margin:12px 0 4px; }
  .fgrid { display:grid; grid-template-columns:150px 1fr; gap:8px 10px; align-items:start; }
  .fgrid label { font-size:13px; color:var(--mute); padding-top:8px; }
  .fgrid input[type=text], .fgrid input[type=number], .fgrid input[type=datetime-local], .fgrid select, .fgrid textarea { width:100%; padding:8px 10px; border:1.5px solid var(--line2); border-radius:10px; background:#fff; }
  .fgrid input[type=checkbox] { width:20px; height:20px; margin-top:8px; }
  .row2 { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; flex-wrap:wrap; }
  .bar select, .bar label.chk { padding:7px 10px; border:1.5px solid var(--line2); border-radius:10px; background:#fff; font-size:13.5px; font-weight:600; }
  details.person summary { cursor:pointer; font-weight:600; font-size:13.5px; }
  @media (max-width:640px) { .fgrid { grid-template-columns:1fr; } .fgrid label { padding-top:0; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API_URL = "https://deeyu-food-api.hoangluuanthaiost.workers.dev/api";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const vnd = n => new Intl.NumberFormat("vi-VN").format(Math.round(n)) + "đ";
const when = iso => { const d = new Date(iso); return iso && !isNaN(d) ? d.toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }) : ""; };
const EXTRA_RICE_RE = /cơm thêm|thêm cơm|phần cơm thêm/i;
const KIND = { com: "Cơm", nuoc: "Nước", "": "Cơm + nước" };
const oLabel = o => o.item + (o.size ? ` (${o.size})` : "") + (o.toppings ? " + " + o.toppings.split("|").join(", ") : "");

const S = { key: sessionStorage.getItem("deeyu_admin") || "", data: null, tab: "sessions", days: 30, debt: false, edit: false, q: "", open: new Set(), err: "" };

async function load() {
  const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "adminView", phone: "0000000000", key: S.key, days: S.days }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
  S.data = j.data; sessionStorage.setItem("deeyu_admin", S.key);
}

// ---- ghi dữ liệu (sửa / thêm / xóa / hoàn tác) qua adminWrite / adminUndo ----
const PK = { members: ["phone"], sessions: ["id"], orders: ["id"], payments: ["session_id", "phone"], notices: ["id"], presets: ["id"], menu: ["id"] };
const nowIso = () => new Date().toISOString();
const keyOf = (t, r) => Object.fromEntries(PK[t].map(c => [c, r[c]]));
const btn = (a, t, r, l) => `<button class="btn mini ${a === "del" ? "del" : ""}" data-stop data-act="${a}" data-tb="${t}" data-k='${esc(JSON.stringify(keyOf(t, r)))}'>${l}</button>`;
const addBtn = (t, l, tpl) => `<button class="btn mini" data-stop data-act="add" data-tb="${t}" data-tpl='${esc(JSON.stringify(tpl || TPL[t]()))}'>${l}</button>`;
// Dòng mẫu khi bấm "+ Thêm" (khóa phiên / thời gian điền sẵn)
const TPL = {
  members: () => ({ phone: "", name: "", created: nowIso() }),
  notices: () => ({ session_id: "", phone: "", time: nowIso(), text: "", seen: 0 }),
  presets: () => ({ type: "com", shop: "", text: "", updated: nowIso(), by: "admin" })
};
// Khai báo form: [cột, nhãn, kiểu, tùy chọn, chỉ-khi-thêm-mới]. Kiểu: text | area | num | bool | sel | dt | list (a|b <-> "a, b")
const F = (k, l, t = "text", o, n) => ({ k, l, t, o, n });
const TYPE = { com: "Cơm", nuoc: "Nước" };
const FIELDS = {
  members: [F("name", "Tên"), F("phone", "SĐT", "text", 0, 1), F("bank", "Ngân hàng"), F("account", "Số tài khoản mới (trống = giữ nguyên)"), F("acc_name", "Tên chủ tài khoản"), F("created", "Tham gia lúc", "dt")],
  sessions: [F("shop", "Quán"), F("kind", "Loại", "sel", { com: "Cơm", nuoc: "Nước", "": "Cơm + nước" }), F("status", "Trạng thái", "sel", { open: "Đang mở", locked: "Đã chốt" }),
    F("owner_name", "Người mở"), F("owner_phone", "SĐT người mở"), F("place", "Nơi giao"), F("notes", "Lưu ý", "area"), F("deadline", "Hạn đặt", "dt"), F("delivery", "Giao (now / giờ ISO / trống)"),
    F("prepay", "Trả trước", "bool"), F("subsidy", "Hỗ trợ mỗi suất (đ)", "num"), F("extra_full", "Cơm thêm đầy đủ", "bool"), F("created", "Tạo lúc", "dt")],
  orders: [F("name", "Tên người đặt"), F("phone", "SĐT", "text", 0, 1), F("item", "Món"), F("size", "Size"), F("toppings", "Topping (cách nhau dấu phẩy)", "list"), F("qty", "Số lượng", "num"),
    F("price", "Đơn giá (đ)", "num"), F("type", "Loại", "sel", TYPE), F("note", "Ghi chú"), F("time", "Giờ đặt", "dt")],
  menu: [F("name", "Tên món"), F("size", "Size"), F("category", "Mục"), F("price", "Giá (đ)", "num"), F("type", "Loại", "sel", TYPE), F("active", "Đang bán", "bool")],
  notices: [F("text", "Nội dung", "area"), F("phone", "SĐT người nhận", "text", 0, 1), F("seen", "Đã xem", "bool"), F("time", "Thời gian", "dt")],
  presets: [F("shop", "Quán"), F("type", "Loại", "sel", TYPE), F("text", "Menu (# Mục / Tên món (size) - 25K)", "area"), F("by", "Bởi"), F("updated", "Cập nhật", "dt")]
};
const toLocal = iso => { const d = new Date(iso); return iso && !isNaN(d) ? new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16) : ""; };
// Tên gọi một dòng, dùng cho câu hỏi xác nhận và nhật ký
const labelOf = (tb, r) => ({ orders: `${r.qty}× ${r.item} của ${r.name || r.phone}`, sessions: `phiên "${r.shop || r.id}"`, members: `thành viên ${r.name}`, menu: `món menu "${r.name}"`,
  notices: "thông báo này", presets: `menu có sẵn "${r.shop}"` }[tb] || "dòng này");

async function call(body) {
  const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ phone: "0000000000", key: S.key, ...body }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error);
}
const write = (table, op, rowKey, row) => call({ action: "adminWrite", table, op, rowKey, row });

// Hộp thoại dùng chung: html là thân hộp; getVal() chạy khi bấm nút có data-ok, trả { error } hoặc giá trị
function dialog(title, html, buttons, getVal) {
  return new Promise(ok => {
    const d = document.createElement("dialog");
    d.innerHTML = `<b>${esc(title)}</b><div class="dbody">${html}</div><div class="err"></div><div class="row2">${buttons}</div>`;
    document.body.appendChild(d); d.showModal();
    let fin = false;
    const done = v => { if (fin) return; fin = true; d.close(); d.remove(); ok(v); };
    d.oncancel = () => done(null);
    d.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
      if (b.dataset.v === "") return done(null);
      const v = getVal ? getVal(d, b.dataset.v) : b.dataset.v;
      if (v && v.error) d.querySelector(".err").textContent = v.error; else done(v);
    });
  });
}
const choose = (title, opts) => dialog(title, "", `<button class="btn" data-v="">Hủy</button>` + opts.map(([l, v]) => `<button class="btn primary" data-v="${v}">${l}</button>`).join(""));

// Form theo từng ô. Thêm mới: trả đủ dòng (gồm các khóa ẩn trong obj); sửa: chỉ trả các cột đã đổi. null nếu hủy
function editForm(title, tb, obj, isNew) {
  const fs = FIELDS[tb].filter(f => isNew || !f.n);
  const init = f => f.t === "bool" ? !!obj[f.k] : f.t === "dt" ? toLocal(obj[f.k]) : f.t === "list" ? String(obj[f.k] ?? "").split("|").filter(Boolean).join(", ") : f.k === "account" && !isNew ? "" : String(obj[f.k] ?? "");
  const input = f => {
    const v = init(f), a = `data-f="${f.k}"`;
    return f.t === "area" ? `<textarea ${a} rows="${f.k === "text" ? 10 : 3}">${esc(v)}</textarea>`
      : f.t === "bool" ? `<input type="checkbox" ${a} ${v ? "checked" : ""}>`
      : f.t === "sel" ? `<select ${a}>${Object.entries(f.o).map(([k, l]) => `<option value="${esc(k)}" ${String(obj[f.k] ?? "") === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`
      : `<input ${a} type="${f.t === "num" ? "number" : f.t === "dt" ? "datetime-local" : "text"}" value="${esc(v)}">`;
  };
  const html = `<div class="fgrid">${fs.map(f => `<label>${esc(f.l)}</label><div>${input(f)}</div>`).join("")}</div>`;
  return dialog(title, html, `<button class="btn" data-v="">Hủy</button><button class="btn primary" data-v="1">Lưu</button>`, d => {
    const out = isNew ? { ...obj } : {};
    for (const f of fs) {
      const el = d.querySelector(`[data-f="${f.k}"]`), raw = f.t === "bool" ? el.checked : el.value;
      if (!isNew && raw === init(f)) continue;
      out[f.k] = f.t === "bool" ? +raw : f.t === "num" ? Number(raw) : f.t === "dt" ? (raw ? new Date(raw).toISOString() : "")
        : f.t === "list" ? raw.split(",").map(x => x.trim()).filter(Boolean).join("|") : raw;
      if (f.t === "num" && (raw.trim() === "" || !Number.isFinite(out[f.k]))) return { error: f.l + " phải là số" };
    }
    return out;
  });
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  e.stopPropagation();
  const { act, tb } = el.dataset, y = scrollY;
  try {
    if (act === "add") {
      const row = await editForm("Thêm — " + (TITLE[tb] || tb), tb, JSON.parse(el.dataset.tpl), true); if (!row) return;
      await write(tb, "insert", {}, row);
    } else if (act === "pay") {
      const { sid, phone } = el.dataset, cur = S.data.payments.find(p => p.session_id === sid && p.phone === phone);
      const v = await choose("Thanh toán " + phone, [["Chưa trả", "0"], ["Báo đã chuyển", "1"], ["Đã trả", "2"]]); if (v == null) return;
      const claimed = +(v === "1"), paid = +(v === "2");
      if (!claimed && !paid) { if (cur) await write("payments", "delete", { session_id: sid, phone }); }
      else await write("payments", cur ? "update" : "insert", { session_id: sid, phone }, { ...(cur ? {} : { session_id: sid, phone }), claimed, paid, updated: nowIso() });
    } else if (act === "undo") {
      if (!confirm("Hoàn tác thao tác này?")) return;
      await call({ action: "adminUndo", logId: +el.dataset.id });
    } else {
      const key = JSON.parse(el.dataset.k), r = S.data[tb].find(x => PK[tb].every(c => x[c] == key[c]));
      if (act === "del") {
        if (!confirm(`Xóa ${labelOf(tb, r)}?` + (tb === "sessions" ? "\nKèm toàn bộ đơn, thanh toán, menu, thông báo của phiên." : "") + "\nCó thể hoàn tác ở tab Nhật ký.")) return;
        await write(tb, "delete", key);
      } else {
        const diff = await editForm("Sửa " + labelOf(tb, r), tb, r, false);
        if (!diff || !Object.keys(diff).length) return;
        await write(tb, "update", key, diff);
      }
    }
    await load(); draw(); scrollTo(0, y);
  } catch (err) { alert(err.message); }
});
const TITLE = { members: "thành viên", orders: "món", menu: "món menu", notices: "thông báo", presets: "menu có sẵn" };

// Gom đơn theo phiên: từng người -> tiền món, trợ cấp, phải trả, trạng thái thanh toán
function model() {
  const d = S.data, pay = {};
  d.payments.forEach(p => pay[p.session_id + "|" + p.phone] = p);
  const menus = {}; d.menu.forEach(m => menus[m.session_id] = (menus[m.session_id] || 0) + 1);
  const by = {};
  d.sessions.forEach(s => by[s.id] = { s, people: {}, qty: 0, due: 0, got: 0, claimed: 0, unpaidPeople: 0, claimedPeople: 0, menu: menus[s.id] || 0 });
  d.orders.forEach(o => {
    const b = by[o.session_id]; if (!b) return;
    const p = b.people[o.phone] ||= { phone: o.phone, name: o.name, rows: [], amount: 0, portions: 0, pay: pay[o.session_id + "|" + o.phone] || {} };
    p.rows.push(o); p.amount += o.price * o.qty; b.qty += o.qty;
    if (b.s.kind === "nuoc" ? o.type === "nuoc" : o.type === "com" && !EXTRA_RICE_RE.test(o.item)) p.portions += o.qty;
  });
  Object.values(by).forEach(b => Object.values(b.people).forEach(p => {
    p.due = p.amount - Math.min(p.amount, (b.s.subsidy || 0) * p.portions);
    b.due += p.due;
    if (p.pay.paid) b.got += p.due;
    else if (p.pay.claimed) { b.claimed += p.due; b.claimedPeople++; }
    else b.unpaidPeople++;
  }));
  return by;
}

const TABS = [
  ["sessions", "Phiên", d => d.sessions.length], ["members", "Thành viên", d => d.members.length],
  ["notices", "Thông báo", d => d.notices.length], ["presets", "Menu có sẵn", d => d.presets.length], ["log", "Nhật ký", d => d.log.length]
];
const match = (obj, q) => !q || Object.values(obj).some(v => String(v ?? "").toLowerCase().includes(q));

function table(cols, rows, empty = "Không có dữ liệu") {
  if (!rows.length) return `<div class="card"><div class="empty">${empty}</div></div>`;
  return `<div class="card scroll"><table><thead><tr>${cols.map(c => `<th class="${c.num ? "num" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(r => `<tr>${cols.map(c => `<td class="${c.num ? "num" : ""} ${c.wide ? "wrap2" : ""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

// Chi tiết một phiên: từng người (tiền phải trả, trạng thái + giờ cập nhật thanh toán) và từng dòng món (giờ đặt, SL, đơn giá, thành tiền, ghi chú)
const hm = iso => { const d = new Date(iso); return iso && !isNaN(d) ? d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", hour12: false }) : ""; };
const payTag = p => p.paid ? `<span class="tag ok">Đã trả</span>` : p.claimed ? `<span class="tag info">Báo đã chuyển</span>` : `<span class="tag bad">Chưa trả</span>`;
function detailHtml(b) {
  const people = Object.values(b.people);
  const have = new Set(people.map(p => p.phone));
  const orphanPay = S.data.payments.filter(p => p.session_id === b.id && !have.has(p.phone));   // có thanh toán mà không còn đơn
  const who = Object.fromEntries(S.data.members.map(m => [m.phone, m.name]));
  return `<div class="detail" data-stop>${people.length ? people.map(p => `<div class="person"><div class="row"><b>${esc(p.name)} <span class="mute small">${esc(p.phone)}</span></b>
      ${payTag(p.pay)}<button class="btn mini" data-stop data-act="pay" data-sid="${esc(b.id)}" data-phone="${esc(p.phone)}">Thanh toán</button>${p.pay.updated ? `<span class="mute small">${when(p.pay.updated)}</span>` : ""}<b class="num">${vnd(p.due)}</b></div>
      ${p.rows.slice().reverse().map(o => `<div class="line"><span class="mute small">${hm(o.time)}</span> ${o.qty}× ${esc(oLabel(o))} <span class="mute">${vnd(o.price)}${o.qty > 1 ? ` · ${vnd(o.price * o.qty)}` : ""}</span>${o.note ? ` <span class="mute">– ${esc(o.note)}</span>` : ""} ${btn("edit", "orders", o, "Sửa")}${btn("del", "orders", o, "Xóa")}</div>`).join("")}</div>`).join("") : `<div class="empty">Chưa có đơn</div>`}
    ${orphanPay.map(p => `<div class="person"><div class="row"><b>${esc(who[p.phone] || p.phone)} <span class="mute small">${esc(p.phone)}</span></b>${payTag({ paid: !!p.paid, claimed: !!p.claimed })}<span class="mute small">${when(p.updated)} · không còn đơn</span></div></div>`).join("")}
    ${b.s ? `<div class="person" data-edit>${addBtn("orders", "+ Thêm món", { session_id: b.id, time: nowIso(), phone: "", name: "", type: "com", item: "", size: "", toppings: "", qty: 1, price: 0, note: "" })}</div>` : ""}
    ${b.s ? menuHtml(b) : ""}
    ${b.s && b.s.notes ? `<div class="person"><div class="line mute" style="white-space:pre-line">Lưu ý: ${esc(b.s.notes)}</div></div>` : ""}</div>`;
}
// Menu của phiên (mở ra xem / sửa từng món)
const menuHtml = b => { const ms = S.data.menu.filter(m => m.session_id === b.id);
  return `<details class="person"><summary>Menu (${ms.length} món)</summary>${ms.map(m => `<div class="line">${esc(m.name)}${m.size ? ` (${esc(m.size)})` : ""} <span class="mute">${vnd(m.price)}${m.category ? " · " + esc(m.category) : ""}${m.active ? "" : " · ẩn"}</span> ${btn("edit", "menu", m, "Sửa")}${btn("del", "menu", m, "Xóa")}</div>`).join("")}
    <div data-edit>${addBtn("menu", "+ Thêm món vào menu", { session_id: b.id, type: b.s.kind === "nuoc" ? "nuoc" : "com", category: "", name: "", size: "", price: 0, active: 1 })}</div></details>`; };
// Văn bản dùng để tìm kiếm của một phiên (quán, người mở, tên / SĐT / món / ghi chú của từng người đặt)
const sessText = b => [b.id, b.s && b.s.shop, b.s && b.s.owner_name, b.s && b.s.owner_phone, b.s && b.s.notes,
  ...Object.values(b.people).flatMap(p => [p.name, p.phone, ...p.rows.flatMap(o => [o.item, o.size, o.toppings, o.note])])].join(" ").toLowerCase();
// Các phiên + khối "Phiên đã xóa" (đơn mà phiên không còn): mới nhất trước
function sessionList(by) {
  const list = Object.entries(by).map(([id, b]) => ({ ...b, id }));
  const ghosts = {};
  S.data.orders.forEach(o => { if (!by[o.session_id]) { const g = ghosts[o.session_id] ||= { id: o.session_id, s: null, people: {}, qty: 0, due: 0, got: 0, menu: 0, ghost: true };
    const p = g.people[o.phone] ||= { phone: o.phone, name: o.name, rows: [], amount: 0, pay: {} }; p.rows.push(o); p.amount += o.price * o.qty; p.due = p.amount; g.qty += o.qty; g.due += o.price * o.qty; } });
  return [...list, ...Object.values(ghosts)];
}

function view(by) {
  const d = S.data, q = S.q.trim().toLowerCase();
  if (S.tab === "sessions") {
    const list = sessionList(by).filter(b => (!q || sessText(b).includes(q)) && (!S.debt || (b.s && b.due > b.got)));
    if (!list.length) return `<div class="card"><div class="empty">Không có phiên nào</div></div>`;
    return `<div class="card">${list.map(b => {
      const s = b.s, people = Object.values(b.people), pct = b.due ? Math.round(b.got / b.due * 100) : 0, open = !!q || S.open.has(b.id);
      return `<div class="sess" data-sess="${esc(b.id)}">
        <div class="top"><b>${s ? esc(s.shop || "(chưa đặt tên quán)") : "Phiên đã xóa"}</b>${s ? `<span class="tag brand">${KIND[s.kind] || "Cơm + nước"}</span>
          <span class="tag ${s.status === "open" ? "ok" : ""}">${s.status === "open" ? "Đang mở" : "Đã chốt"}</span>${s.prepay ? `<span class="tag warn">Trả trước</span>` : ""}` : ""}
          <span class="mute small">${open ? "▾" : "▸"}</span>${s ? btn("edit", "sessions", s, "Sửa") + btn("del", "sessions", s, "Xóa") : ""}</div>
        <div class="meta">${s ? `<span>${esc(s.owner_name)} · ${esc(s.owner_phone)}</span><span>${when(s.created)}</span>` : ""}<span>${people.length} người · ${b.qty} phần</span>
          ${s ? (b.due ? `<span>Cần thu ${vnd(b.due)}</span><span style="color:var(--ok)">Đã thu ${vnd(b.got)} (${pct}%)</span>
            <span style="color:${b.due > b.got ? (s.status === "open" ? "var(--ink2)" : "var(--bad)") : "var(--ok)"}">${b.due > b.got ? `Còn ${vnd(b.due - b.got)}${b.claimed ? ` (${vnd(b.claimed)} chờ xác nhận)` : ""}` : "✓ Đã đủ"}</span>` : `<span>Chưa có đơn</span>`) : `<span>Tổng ${vnd(b.due)}</span>`}
          ${s && s.subsidy ? `<span>Hỗ trợ ${vnd(s.subsidy)}/suất</span>` : ""}${s ? `<span>Menu ${b.menu} món</span>` : ""}<span class="mute">#${esc(b.id)}</span></div>
        ${b.due && s ? `<div class="prog"><i style="width:${pct}%"></i></div>` : ""}
        ${open ? detailHtml(b) : ""}</div>`;
    }).join("")}</div>`;
  }
  if (S.tab === "members") return table([{ h: "Tên", f: r => `<b>${esc(r.name)}</b>` }, { h: "SĐT", f: r => esc(r.phone) }, { h: "Tham gia", f: r => when(r.created) },
    { h: "Ngân hàng nhận tiền", f: r => r.bank ? `${esc(r.bank)} ${esc(r.account)} <span class="mute">${esc(r.acc_name)}</span>` : `<span class="mute">—</span>` },
    { h: "", f: r => btn("edit", "members", r, "Sửa") + btn("del", "members", r, "Xóa") }], d.members.filter(r => match(r, q)));
  if (S.tab === "notices") {
    const who = Object.fromEntries(d.members.map(m => [m.phone, m.name]));
    return table([{ h: "Thời gian", f: r => when(r.time) }, { h: "Gửi cho", f: r => `<b>${esc(who[r.phone] || r.phone)}</b>` }, { h: "Nội dung", wide: true, f: r => esc(r.text) },
      { h: "Đã xem", f: r => r.seen ? `<span class="tag ok">Đã hiểu</span>` : `<span class="tag warn">Chưa xem</span>` },
      { h: "", f: r => btn("edit", "notices", r, "Sửa") + btn("del", "notices", r, "Xóa") }], d.notices.filter(r => match(r, q)), "Chưa có thông báo nào");
  }
  if (S.tab === "log") return table([{ h: "Thời gian", f: r => when(r.time) }, { h: "Thao tác", f: r => `<span class="tag ${r.op === "delete" ? "bad" : r.op === "insert" ? "ok" : "info"}">${{ insert: "Thêm", update: "Sửa", delete: "Xóa" }[r.op]}</span> ${esc(r.tbl)}` },
    { h: "Nội dung", wide: true, f: r => esc(logText(r)) }, { h: "IP", f: r => `<span class="mute small">${esc(r.ip)}</span>` },
    { h: "", f: r => r.undone ? `<span class="tag">Đã hoàn tác</span>` : `<button class="btn mini" data-stop data-act="undo" data-id="${r.id}">Hoàn tác</button>` }], d.log.filter(r => match(r, q)), "Chưa có thao tác nào");
  return table([{ h: "Quán", f: r => `<b>${esc(r.shop)}</b>` }, { h: "Loại", f: r => KIND[r.type] }, { h: "Độ dài menu", num: true, f: r => r.chars + " ký tự" }, { h: "Cập nhật", f: r => when(r.updated) }, { h: "Bởi", f: r => esc(r.by) }, { h: "", f: r => btn("edit", "presets", r, "Sửa") + btn("del", "presets", r, "Xóa") }],
    d.presets.filter(r => match(r, q)));
}

const J = x => { try { return JSON.parse(x); } catch { return null; } };
function logText(l) {
  const b = J(l.before), a = J(l.after), nm = r => r ? (r.shop || r.name || r.item || r.text || "") : "";
  if (l.op === "insert") return nm(a) || Object.values(J(l.row_key) || {}).join("/");
  if (l.op === "update") return `${nm(b.row)}: ` + Object.keys(a).map(c => `${c} ${b.row[c] ?? "—"} → ${a[c]}`).join(" · ");
  return nm(b.row) + (b.orders ? ` (kèm ${b.orders.length} đơn, ${b.menu.length} món menu)` : "");
}
// Tab Phiên: mỗi dòng CSV là một dòng món, kèm thông tin phiên + trạng thái thanh toán của người đặt (theo ô tìm kiếm đang lọc)
function csvRows() {
  const d = S.data, q = S.q.trim().toLowerCase();
  if (S.tab !== "sessions") return { members: d.members, notices: d.notices, presets: d.presets, log: d.log }[S.tab];
  const out = [];
  sessionList(model()).filter(b => !q || sessText(b).includes(q)).forEach(b => Object.values(b.people).forEach(p => p.rows.slice().reverse().forEach(o => {
    const s = b.s || {};
    out.push({ phien: b.id, quan: s.shop || "(phiên đã xóa)", loai: KIND[s.kind] ?? "", trang_thai_phien: s.status || "", ngay_tao_phien: s.created || "", nguoi_mo: s.owner_name || "", sdt_nguoi_mo: s.owner_phone || "",
      gio_dat: o.time, nguoi_dat: o.name, sdt: o.phone, mon: o.item, size: o.size, topping: o.toppings, so_luong: o.qty, don_gia: o.price, thanh_tien: o.price * o.qty,
      ghi_chu: o.note, thanh_toan: p.pay.paid ? "Đã trả" : p.pay.claimed ? "Báo đã chuyển" : "Chưa trả", cap_nhat_thanh_toan: p.pay.updated || "", phai_tra_sau_ho_tro: Math.round(p.due) });
  })));
  return out;
}
function csv() {
  const rows = csvRows();
  if (!rows || !rows.length) return alert("Không có dữ liệu để tải");
  const cols = Object.keys(rows[0]), cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const text = "﻿" + [cols.join(","), ...rows.map(r => cols.map(c => cell(r[c])).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" })); a.download = `deeyu-${S.tab}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

function draw() {
  const root = $("#app");
  if (!S.data) {
    root.innerHTML = `<div class="login"><img src="img/logo-256.png" alt=""><h2>Quản trị dữ liệu</h2><p>Nhập mã quản trị để xem và chỉnh sửa database</p>
      <input id="key" type="password" placeholder="Mã quản trị" autocomplete="current-password" autofocus><button class="btn primary" id="go">Vào</button><div class="err" id="err">${esc(S.err)}</div></div>`;
    const go = async () => {
      S.key = $("#key").value.trim(); if (!S.key) return;
      $("#go").disabled = true; $("#go").textContent = "Đang tải…";
      try { await load(); S.err = ""; } catch (e) { S.err = e.message; sessionStorage.removeItem("deeyu_admin"); }
      draw();
    };
    $("#go").onclick = go; $("#key").onkeydown = e => { if (e.key === "Enter") go(); };
    return;
  }
  document.body.classList.toggle("edit", S.edit);
  const d = S.data, by = model(), all = Object.values(by);
  if (!S.inited) { S.inited = true; if (d.sessions[0]) S.open.add(d.sessions[0].id); }
  const sum = k => all.reduce((t, b) => t + b[k], 0);
  const need = sum("due"), got = sum("got"), claimed = sum("claimed"), todo = need - got - claimed;
  const unpaidP = sum("unpaidPeople"), claimedP = sum("claimedPeople"), pct = need ? Math.round(got / need * 100) : 0;
  root.innerHTML = `<header><div class="in"><img src="img/logo-256.png" alt=""><h1>Deeyu Food<small>Dữ liệu D1 · cập nhật ${when(d.at)}</small></h1>
      <button class="btn ${S.edit ? "on" : ""}" id="editmode">Chế độ sửa: ${S.edit ? "Bật" : "Tắt"}</button><button class="btn" id="csv">Tải CSV</button><button class="btn primary" id="refresh">Làm mới</button><button class="btn" id="out">Thoát</button></div></header>
    <div class="wrap">
      <div class="stats"><div class="stat"><span>Thành viên</span><b>${d.members.length}</b></div><div class="stat"><span>Phiên</span><b>${d.sessions.length}</b></div>
        <div class="stat"><span>Dòng đơn</span><b>${d.orders.length}</b></div></div>
      <div class="card money"><h2>Thu tiền ${S.days ? `(${S.days} ngày gần nhất)` : "(tất cả)"} <small>${unpaidP + claimedP ? `${unpaidP + claimedP} người chưa được xác nhận trả` : "mọi người đã trả đủ"}</small></h2>
        <div class="stats flat"><div class="stat"><span>Cần thu</span><b>${vnd(need)}</b></div><div class="stat ok"><span>Đã thu</span><b>${vnd(got)}</b></div>
          <div class="stat info"><span>Chờ xác nhận <small>${claimedP} người báo đã chuyển</small></span><b>${vnd(claimed)}</b></div>
          <div class="stat ${todo > 0 ? "bad" : ""}"><span>Chưa chuyển <small>${unpaidP} người</small></span><b>${vnd(todo)}</b></div></div>
        <div class="prog"><i style="width:${pct}%"></i></div></div>
      <div class="bar"><div class="tabs">${TABS.map(([k, l, n]) => `<button data-t="${k}" class="${S.tab === k ? "on" : ""}">${l}<span class="n">${n(d)}</span></button>`).join("")}</div>
        <select id="days" title="Khoảng thời gian của phiên">${[[1, "Hôm nay"], [7, "7 ngày"], [30, "30 ngày"], [0, "Tất cả"]].map(([v, l]) => `<option value="${v}" ${S.days === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        ${S.tab === "sessions" ? `<label class="chk"><input type="checkbox" id="debt" ${S.debt ? "checked" : ""}> Còn nợ</label>` : ""}${TPL[S.tab] ? addBtn(S.tab, "+ Thêm") : ""}${S.tab === "sessions" ? `<button class="btn" id="openAll">Mở hết</button><button class="btn" id="closeAll">Thu gọn</button>` : ""}
        <div class="search"><input id="q" type="search" placeholder="Tìm theo tên, SĐT, món, quán…" value="${esc(S.q)}"></div></div>
      <div id="view">${view(by)}</div>
      <div class="foot">Bật “Chế độ sửa” để sửa / xóa / thêm. Mọi thay đổi ghi thẳng vào database và có trong tab Nhật ký (hoàn tác được).</div></div>`;
  wire(by);
}
function wire(by) {
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.q = ""; draw(); });
  $("#q").oninput = e => { S.q = e.target.value; $("#view").innerHTML = view(by); bindSess(); };
  if ($("#openAll")) { $("#openAll").onclick = () => { sessionList(by).forEach(b => S.open.add(b.id)); $("#view").innerHTML = view(by); bindSess(); };
    $("#closeAll").onclick = () => { S.open.clear(); $("#view").innerHTML = view(by); bindSess(); }; }
  $("#editmode").onclick = () => { S.edit = !S.edit; document.body.classList.toggle("edit", S.edit); $("#editmode").classList.toggle("on", S.edit); $("#editmode").textContent = "Chế độ sửa: " + (S.edit ? "Bật" : "Tắt"); };
  $("#days").onchange = async e => { S.days = +e.target.value; try { await load(); } catch (err) { alert(err.message); } draw(); };
  if ($("#debt")) $("#debt").onchange = e => { S.debt = e.target.checked; $("#view").innerHTML = view(by); bindSess(); };
  $("#csv").onclick = csv; $("#out").onclick = () => { sessionStorage.removeItem("deeyu_admin"); S.data = null; S.key = ""; draw(); };
  $("#refresh").onclick = async () => { $("#refresh").disabled = true; $("#refresh").textContent = "Đang tải…"; try { await load(); } catch (e) { alert(e.message); } draw(); };
  bindSess();
}
function bindSess() {
  document.querySelectorAll("[data-sess]").forEach(el => el.onclick = e => {
    if (e.target.closest("[data-stop]")) return;
    const id = el.dataset.sess; S.open.has(id) ? S.open.delete(id) : S.open.add(id);
    $("#view").innerHTML = view(model()); bindSess();
  });
}

(async () => { if (S.key) { try { await load(); } catch (e) { S.err = e.message; } } draw(); })();
</script>
</body>
</html>
