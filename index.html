// "Trà đào (L)" -> tên "Trà đào" + size "L". Mục có chữ "topping" là danh sách topping (cộng thêm giá cho món nước)
const SIZE_RE = /\s*\((2XL|XL|S|M|L|\d+ml)\)\s*$/i;
const splitSize = n => { const m = n.match(SIZE_RE); return m ? { name: n.replace(SIZE_RE, "").trim(), size: m[1].toUpperCase() } : { name: n, size: "" }; };
const isTopping = m => /topping/i.test(m.category || "");
const menuLabel = m => m.name + (m.size ? ` (${m.size})` : "");
const orderLabel = o => `${o.item}${o.size ? ` (${o.size})` : ""}${o.toppings ? " + " + o.toppings.split("|").join(", ") : ""}`;
function drinkOptions(type) {   // món gọi được (không tính topping), gom các size cùng tên

function menuText(type) {

// "35" / "35k" / "35.000" / "12.5" / "12,5k" -> đồng
function toPrice(raw, suffix) {

  let price;

}
const cleanName = n => n.replace(/^[^\p{L}\p{N}]+/u, "").replace(/[\s\-–|:/,;+]+$/g, "").replace(/^\d+[.)]\s+/, "").trim();
// "Trà đào M 25 L 30" / "Trà đào 25k/30k" -> [{ name: "Trà đào (M)", price: 25000 }, { name: "Trà đào (L)", price: 30000 }]; không có giá -> []
const SIZE_DEFAULT = { 2: ["M", "L"], 3: ["S", "M", "L"] };
const TAIL_RE = /^(.*?)[\s\-–—|/,;:.…]*(?:(?<![\p{L}\p{N}])(XL|S|M|L)(?![\p{L}\p{N}])[\s:.\-]*)?(\d[\d.,]*)\s*(k|đ|d|₫|vnđ|vnd)?\s*$/iu;
function parseMenuLine(l) {

    if (!(unit || size || /^\d+[.,]\d{1,2}$/.test(raw) || Number(raw.replace(/[.,]/g, "")) >= 10)) break;
    const price = toPrice(raw, unit);
    if (!(price > 0)) break;
    toks.unshift({ price, size: size && size.toUpperCase() }); rest = m[1];
  }
  const name = cleanName(rest);
  if (!toks.length || !name) return [];
  if (toks.length === 1) return [{ name: toks[0].size ? `${name} (${toks[0].size})` : name, price: toks[0].price }];
  const labels = toks.every(t => t.size) ? toks.map(t => t.size) : (SIZE_DEFAULT[toks.length] || toks.map((_, i) => "#" + (i + 1)));
  return toks.map((t, i) => ({ name: `${name} (${labels[i]})`, price: t.price }));
}
// Dòng không giá, ngắn = tiêu đề mục ("TRÀ SỮA" -> "Trà sữa")
const cleanHeading = l => {
  let h = l.replace(/^[#\s]+/, "").replace(/^[^\p{L}\p{N}]+/u, "").replace(/[\s:\-–|/.]+$/g, "").trim();
  if (h === h.toUpperCase()) h = h.toLowerCase().replace(/^./u, c => c.toUpperCase());

};
const isHeading = l => l.length <= 40 && /\p{L}/u.test(l) && !parseMenuLine(l).length;

// Ô menu: dòng "# Tên mục" bắt đầu một nhóm; các món trước mọi "#" không thuộc mục nào
function readGroups(text) {
  const groups = [{ cat: "", lines: [] }]; let cur = groups[0];
  text.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {
    if (l[0] === "#") {
      const cat = l.replace(/^#+\s*/, "").trim();
      cur = groups.find(g => g.cat === cat);
      if (!cur) groups.push(cur = { cat, lines: [] });
    } else cur.lines.push(l);
  });

}
const groupsText = groups => groups.filter(g => g.lines.length).map(g => (g.cat ? `# ${g.cat}\n` : "") + g.lines.join("\n")).join("\n");
// Thêm món [{name, price, cat}] vào ô menu, bỏ món trùng tên; trùng tên khác mục -> thêm "(tên mục)"
function mergeIntoBox(box, items) {
  const groups = readGroups(box.value), have = new Map();
  groups.forEach(g => g.lines.forEach(l => { const p = parsePriceLine(l.replace(/\(hết\)\s*$/i, ""), true); if (p) have.set(p.name.toLowerCase(), g.cat); }));
  let added = 0;
  items.forEach(it => {
    let name = it.name; const cat = it.cat || "";
    if (have.has(name.toLowerCase())) {
      if (!cat || have.get(name.toLowerCase()) === cat) return;
      name = `${name} (${cat})`;
      if (have.has(name.toLowerCase())) return;
    }
    have.set(name.toLowerCase(), cat);
    let g = groups.find(x => x.cat === cat);
    if (!g) groups.push(g = { cat, lines: [] });

}
const groupByCat = items => {
  const groups = [];
  items.forEach(m => { const cat = m.category || ""; let g = groups.find(x => x.cat === cat); if (!g) groups.push(g = { cat, items: [] }); g.items.push(m); });
  return groups.sort((a, b) => (a.cat ? 1 : 0) - (b.cat ? 1 : 0));

// "Cơm gà - 35.000đ" / "Trà đá 5k" / "Cà phê 12.5" / "20" -> { name, price (đồng) } hoặc null
// zero = true: cho phép giá 0 (món chọn kèm combo trong mục "Topping…" – không cộng tiền)
function parsePriceLine(l, zero = false) {
  const m = l.trim().match(/^(.*?)[\s\-–—|:.…]*?(\d[\d.,]*)\s*(k|đ|d|₫|vnđ|vnd)?\s*$/i);
  if (!m) return null;
  const name = m[1]
    .replace(/^[^\p{L}\p{N}]+/u, "")                          // bỏ emoji / ký hiệu đầu dòng
    .replace(/[\s:\-–|(]+\d[\d.,]*\s*(k|đ|vnđ)\)?$/i, "")      // "Ức gà: 27K - 30K" -> bỏ "27K", giữ giá cuối 30K
    .replace(/[\s\-–|:+]+$/g, "").replace(/^\d+[.)]\s+/, "");

  const price = toPrice(m[2], m[3]);
  return price > 0 || (zero && price === 0) ? { name, price } : null;
}
function parseMenu(text, type) {
  let category = "";
  return text.split("\n").map(l => l.trim()).filter(Boolean).flatMap(l => {
    if (l[0] === "#") { category = l.replace(/^#+\s*/, "").trim().slice(0, 60); return []; }
    const active = !/\(hết\)\s*$/i.test(l);
    l = l.replace(/\(hết\)\s*$/i, "").trim();
    const p = parsePriceLine(l, /topping/i.test(category));
    if (!p) throw new Error(`Dòng sai định dạng: "${l}" (cần "Tên món - giá", VD "Cơm gà - 35K"; dòng "# Tên mục" để chia mục)`);
    const { name, size } = splitSize(p.name);
    return [{ name, size: /topping/i.test(category) ? "" : size, price: p.price, type, active, category }];

/* --- Nhập menu nhanh (riêng cho Cơm / Nước): dán văn bản hoặc ảnh chụp màn hình --- */
const TYPE_INFO = {
  com:  { icon: I("rice", "sm"), label: "cơm", eg: "Cơm gà xối mỡ - 35K\nCơm sườn - 40K" },
  nuoc: { icon: I("cup", "sm"), label: "nước", eg: "Trà đá - 5K\nCà phê sữa - 20K" }
};

// OCR hay tách giá ra dòng riêng -> ghép lại với dòng tên phía trên
function joinPriceLines(text) {
  const out = [];
  text.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {
    const priceOnly = /^[\d.,]+\s*(k|đ|d|₫|vnđ|vnd)?$/i.test(l);
    if (priceOnly && out.length && !/\d\s*(k|đ|d|₫|vnđ|vnd)?$/i.test(out[out.length - 1])) out[out.length - 1] += " " + l;
    else out.push(l);
  });
  return out;
}

// Dòng KHÔNG phải món chính: SĐT/địa chỉ quán -> bỏ; lưu ý về món (sốt, món thêm...) -> ghi chú của mục cơm/nước
const PHONE_RE = /(?:\+?84|0)\d[\d\s.\-]{7,}\d/;
const NOTE_RE = /lưu ý|ghi chú|\bthêm\b|chỉ thêm|phần cơm thứ|ăn kèm/i;
// Menu combo: "2 món: 27K" + danh sách món không giá để chọn -> combo là món có giá, các món chọn là topping giá 0 (mục chứa chữ "topping")
const COMBO_RE = /(?<![\p{L}\p{N}])\d+\s*món(?![\p{L}])/iu, COMBO_CAT = "Combo chọn món", OPT_CAT = "Topping: món chọn trong combo";
const OPT_RE = /^[^\p{L}\p{N}]*\d+\s*[.)]\s+(\S.*)$/u;
// SĐT, địa chỉ, ship... của quán: bỏ hẳn, không lưu
const DROP_RE = /đặt món|đặt hàng|hotline|sđt|số điện thoại|liên hệ|zalo|freeship|giao hàng|giao (?:liền|tận|khu)|đợt \d|chuyến \d|comment|địa chỉ|\bđc\b/i;
// "Cơm thêm 5K" -> thành món có nút + ở mục cơm, không nằm trong ghi chú
const EXTRA_RICE_RE = /cơm thêm|thêm cơm|phần cơm thêm/i;
const isDropLine = l => PHONE_RE.test(l) || DROP_RE.test(l);

// Phân tích văn bản menu (không đụng tới giao diện): món + size + giá, topping, tên quán đoán được, ghi chú
function analyzeMenu(text, type) {
  const items = [], notes = [];
  let skipped = 0, dropped = 0, cat = "", shop = "";
  const all = joinPriceLines(text);
  // Dòng tiêu đề đầu tiên (khi menu có ≥ 2 tiêu đề) là tên quán, các tiêu đề sau là tên mục
  const isTitle = l => !isDropLine(l) && !NOTE_RE.test(l) && l[0] !== "#" && isHeading(l);
  if (!state.pendingNote.shops[type] && all.length && isTitle(all[0]) && all.filter(isTitle).length >= 2) shop = cleanHeading(all.shift());
  const hasCombo = all.some(l => COMBO_RE.test(l) && !isDropLine(l) && parseMenuLine(l).length);
  all.forEach(l => {
    if (l[0] === "#") { cat = cleanHeading(l); return; }
    if (!/[\p{L}\p{N}]/u.test(l)) return;   // dòng kẻ ngang "———"
    if (hasCombo && !parseMenuLine(l).length && !isDropLine(l) && !NOTE_RE.test(l)) {
      const o = OPT_RE.exec(l), name = o && cleanName(o[1]);
      if (name) return items.push({ name, price: 0, cat: OPT_CAT });
    }
    if (hasCombo && COMBO_RE.test(l) && !isDropLine(l)) {
      const ps = parseMenuLine(l);
      if (ps.length) return ps.forEach(p => items.push({ ...p, name: /^combo/i.test(p.name) ? p.name : "Combo " + p.name, cat: COMBO_CAT }));
    }
    const isExtraRice = type === "com" && EXTRA_RICE_RE.test(l) && parseMenuLine(l).length;
    if (!isExtraRice && isDropLine(l)) return dropped++;
    if (!isExtraRice && NOTE_RE.test(l)) {
      const clean = l.replace(/^[^\p{L}\p{N}+]+/u, "");
      if (!state.pendingNote[type].includes(clean) && !notes.includes(clean)) notes.push(clean);
      return;
    }
    const ps = parseMenuLine(l);
    if (ps.length) return ps.forEach(p => items.push({ ...p, cat }));
    if (isHeading(l)) { cat = cleanHeading(l); return; }
    skipped++;

  return { shop, items, notes, skipped, dropped };
}

// Gom kết quả phân tích thành các dòng xem trước: mỗi món (kèm các size) hoặc topping là một dòng
function previewRows(items) {

    if (!r) rows.push(r = { key, cat: it.cat, name, top, items: [] });
    r.items.push({ ...it, size });

  return rows;
}

let tessLoading;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return tessLoading ||= new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js";
    s.onload = ok; s.onerror = () => { tessLoading = null; fail(new Error("Không tải được bộ đọc ảnh (cần internet)")); };
    document.head.appendChild(s);

// Phóng to, chuyển xám, kéo giãn tương phản; menu nền tối chữ sáng thì đảo màu -> OCR đọc tốt hơn
async function prepareForOcr(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(3, Math.max(1, 2200 / bmp.width)), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.imageSmoothingQuality = "high"; cx.drawImage(bmp, 0, 0, w, h);
  const img = cx.getImageData(0, 0, w, h), d = img.data, g = new Uint8Array(w * h), hist = new Array(256).fill(0);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) { g[j] = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0; hist[g[j]]++; }
  const pct = q => { let c = 0; for (let v = 0; v < 256; v++) { c += hist[v]; if (c >= g.length * q) return v; } return 255; };
  const lo = pct(0.02), hi = Math.max(lo + 1, pct(0.98)), mean = g.reduce((t, v) => t + v, 0) / g.length, invert = mean < 110;
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    let v = Math.max(0, Math.min(255, (g[j] - lo) * 255 / (hi - lo)));
    if (invert) v = 255 - v;
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  cx.putImageData(img, 0, 0);
  return cv;
}
// Gom các từ (có tọa độ) thành văn bản: tách cột theo khe trống dọc, mỗi cột đọc từ trên xuống
function wordsToColumnText(words, W) {

  const hs = words.map(w => w.y1 - w.y0).sort((a, b) => a - b), mh = hs[hs.length >> 1];
  const bw = Math.max(2, Math.round(mh / 2)), nb = Math.ceil(W / bw) + 1, cov = new Array(nb).fill(0);
  words.forEach(w => { for (let b = Math.floor(w.x0 / bw); b <= Math.min(nb - 1, Math.floor(w.x1 / bw)); b++) cov[b]++; });
  const thr = Math.floor(Math.max(...cov) * 0.08), first = cov.findIndex(c => c > 0), last = cov.length - 1 - [...cov].reverse().findIndex(c => c > 0);
  const cuts = [];
  for (let b = first; b <= last;) {
    if (cov[b] > thr) { b++; continue; }
    let e = b; while (e <= last && cov[e] <= thr) e++;
    if ((e - b) * bw >= 2 * mh) cuts.push(((b + e) / 2) * bw);
    b = e;
  }
  let cols = Array.from({ length: cuts.length + 1 }, () => []);
  words.forEach(w => cols[cuts.filter(c => c < (w.x0 + w.x1) / 2).length].push(w));
  cols = cols.filter(c => c.length);
  // cột gần như chỉ toàn số (cột giá của bảng "tên | giá") thì gộp lại với cột bên trái
  const merged = [];
  cols.forEach(c => {
    const nums = c.filter(w => /^\d[\d.,]*(k|đ|d)?$/i.test(w.text.trim())).length;
    if (merged.length && nums >= 0.7 * c.length) merged[merged.length - 1].push(...c); else merged.push([...c]);
  });
  return merged.map(col => {
    const lines = [];
    col.sort((a, b) => (a.y0 + a.y1) - (b.y0 + b.y1)).forEach(w => {
      const yc = (w.y0 + w.y1) / 2, L = lines[lines.length - 1];
      if (L && Math.abs(yc - L.y) <= 0.6 * mh) { L.w.push(w); L.y += (yc - L.y) / L.w.length; } else lines.push({ y: yc, w: [w] });
    });
    return lines.map(L => L.w.sort((a, b) => a.x0 - b.x0).map(w => w.text).join(" ")).join("\n");
  }).join("\n");
}
// Cắt dải dọc [f0, f1] của ảnh (tỉ lệ 0..1), thu nhỏ (cạnh dài ≤ 1400px) cho nhanh, JPEG -> base64
function cropToBase64(bmp, f0, f1) {
  const sx = Math.round(bmp.width * f0), sw = Math.round(bmp.width * f1) - sx, k = Math.min(1, 1400 / Math.max(sw, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(sw * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, sx, 0, sw, bmp.height, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", 0.7).split(",")[1];
}
// Menu dài/nhiều cột: cắt 3 dải (chồng nhẹ 2%) đọc song song cho nhanh, rồi gộp theo mục, bỏ dòng trùng.
// Chờ tối đa limitMs (15 giây): dải nào xong thì dùng, dải chậm bỏ qua và báo `late`
async function aiReadMenu(file, onDone, limitMs = 15000) {
  const bmp = await createImageBitmap(file), wide = bmp.width / bmp.height > 0.6;
  const strips = wide ? [[0, 0.353], [0.313, 0.687], [0.647, 1]] : [[0, 1]];
  let done = 0, firstErr = null; const t0 = Date.now(), got = [];
  const jobs = strips.map(([a, b], i) => api("readMenuImage", { image: cropToBase64(bmp, a, b), mime: "image/jpeg" }).then(r => {
    got[i] = r; done++; onDone?.(`Đã đọc xong ${done}/${strips.length} phần (${Math.round((Date.now() - t0) / 1000)}s)`);
  }, e => { firstErr ||= e; }));
  await Promise.race([Promise.all(jobs), new Promise(ok => setTimeout(ok, limitMs))]);
  const rs = got.filter(Boolean), late = strips.length - rs.length - (firstErr ? 1 : 0);
  if (!rs.length) throw firstErr || new Error(`TIMEOUT: AI chưa đọc xong trong ${Math.round(limitMs / 1000)} giây – thử lại, hoặc dùng ảnh nhỏ / rõ hơn`);
  console.log("AI đọc menu:", rs.map(r => r.info));
  const groups = [{ cat: "", lines: [] }];
  rs.forEach(r => readGroups(r.text).forEach(g => {
    let t = groups.find(x => x.cat === g.cat);
    if (!t) groups.push(t = { cat: g.cat, lines: [] });
    g.lines.forEach(l => { if (!t.lines.includes(l)) t.lines.push(l); });
  }));
  return { text: groupsText(groups), shop: rs.map(r => r.shop).find(Boolean) || "", notes: [...new Set(rs.flatMap(r => r.notes))], info: rs.map((r, i) => `Phần ${i + 1} – ${r.info}`).join("\n"), late: Math.max(0, strips.length - rs.length) };
}
async function ocrImage(file, onProgress) {
  await loadTesseract();
  const cv = await prepareForOcr(file);
  const worker = await Tesseract.createWorker("vie", 1, { logger: m => m.status && onProgress(m) });
  try {
    await worker.setParameters({ tessedit_pageseg_mode: "11", preserve_interword_spaces: "1" });
    const { data } = await worker.recognize(cv, {}, { text: true, blocks: true });
    const words = (data.blocks || []).flatMap(b => b.paragraphs.flatMap(p => p.lines.flatMap(l => l.words)))
      .map(w => ({ text: w.text, x0: w.bbox.x0, y0: w.bbox.y0, x1: w.bbox.x1, y1: w.bbox.y1 }));
    return words.length ? wordsToColumnText(words, cv.width) : data.text;
  } finally { await worker.terminate(); }
}

// Quán mới có trùng quán đã có sẵn không? Trùng tên -> exact; tên khác nhưng cùng quán -> AI (backend) đoán, lỗi AI thì so khớp chuỗi
async function findDupShop(shop, type, list) {
  const f = s => fold(s).replace(/[^a-z0-9]/g, ""), k = f(shop);
  const same = list.find(p => f(p.shop) === k);
  if (same) return { name: same.shop, exact: true };
  if (!list.length) return null;
  try { const r = await api("checkShop", { shop, type }); return r.dup ? { name: r.dup } : null; }
  catch {
    const near = list.find(p => { const q = f(p.shop); return q.length >= 4 && k.length >= 4 && (q.includes(k) || k.includes(q)); });
    return near ? { name: near.shop } : null;
  }
}
// Lưu menu thành "menu có sẵn": kiểm tra trùng quán (AI), hỏi lại, rồi lưu. Trả true nếu đã lưu. st(msg) hiện thông báo
async function savePresetFlow(shop, type, text, st) {
  text = text.split("\n").map(l => l.replace(/\s*\(hết\)\s*$/i, "").trim()).filter(Boolean).join("\n");
  if (!shop) return st("Nhập tên quán trước khi thêm vào menu có sẵn."), false;
  if (!text) return st("Danh sách món đang trống."), false;
  try { parseMenu(text, type); } catch (e) { return st(e.message), false; }
  st("Đang kiểm tra quán có bị trùng không…");
  const dup = await findDupShop(shop, type, (await loadPresets().catch(() => [])).filter(p => p.type === type));
  st("");
  const warn = !dup ? "" : dup.exact ? `⚠ Đã có menu có sẵn "${dup.name}" – lưu sẽ GHI ĐÈ bản cũ.\n\n`
    : `⚠ Quán "${shop}" có vẻ trùng với menu có sẵn "${dup.name}". Nếu là một quán thì bấm Hủy rồi dùng đúng tên cũ.\n\n`;
  if (!await ask(`${warn}Thêm "${shop}" vào menu có sẵn (${TYPE_INFO[type].label})?\nAi tạo phiên cũng chọn được.`, dup?.exact ? "Ghi đè" : "Thêm vào menu")) return st("Đã hủy – chưa thêm vào menu có sẵn."), false;
  try { await api("savePreset", { shop, type, text }); presetsP = null; st(`Đã thêm "${shop}" vào menu có sẵn ✓`); return true; }
  catch (e) { return st("Lỗi: " + e.message), false; }
}

function wireImport(type) {
  const q = k => $(`[data-imp-${k}="${type}"]`);
  const status = msg => q("status").textContent = msg;
  // Phân tích văn bản trong ô và hiện kết quả xem trước, chờ người dùng bấm "Thêm vào menu"
  const analyze = () => {
    const text = q("text").value.trim();
    if (!text) return status("Chưa có văn bản để phân tích.");
    const r = analyzeMenu(text, type);
    state.preview[type] = { ...r, rows: previewRows(r.items) };
    drawPreview(type);
    status(`Đọc được ${state.preview[type].rows.length} món. Bỏ tích dòng sai rồi bấm "Thêm vào menu ${TYPE_INFO[type].label}".`);
  };
  const runOcr = async file => {
    state.busy = true; q("go").disabled = true;
    try {
      let text, ai = null, aiFail = "";
      const t0 = Date.now(); let prog = "";
      const tick = setInterval(() => status(`Đang đọc ảnh bằng AI… ${Math.round((Date.now() - t0) / 1000)}s ${prog}`), 1000);
      try {
        status("Đang đọc ảnh bằng AI…");
        ai = await aiReadMenu(file, m => prog = "– " + m);
        text = ai.text;
        clearInterval(tick);
      } catch (e) {
        clearInterval(tick);
        if (/^TIMEOUT/.test(e.message)) throw new Error(e.message.replace(/^TIMEOUT:\s*/, ""));   // quá 15 giây: không rơi xuống đọc ảnh cơ bản (chậm hơn)
        aiFail = e.message === "NO_AI_KEY" ? "Chưa cấu hình GEMINI_API_KEY" : /không hợp lệ/.test(e.message) ? "Backend chưa deploy bản mới" : e.message;
        status(`AI không dùng được (${aiFail}) – dùng đọc ảnh cơ bản, có thể sai. Đang đọc… (lần đầu ~30 giây)`);
        text = await ocrImage(file, m => status(`Đọc ảnh cơ bản (có thể sai): ${m.status}${m.progress ? " " + Math.round(m.progress * 100) + "%" : ""}`));
      }
      q("text").value = text.trim();
      state.dirty = true;
      analyze();
      if (ai) {
        const pv = state.preview[type];
        if (ai.shop && !pv.shop && !state.pendingNote.shops[type]) pv.shop = ai.shop;
        pv.notes.push(...ai.notes.filter(n => !state.pendingNote[type].includes(n) && !pv.notes.includes(n)));
        drawPreview(type);
        status(`AI đã đọc: ${pv.rows.length} dòng trong ${Math.round((Date.now() - t0) / 1000)}s. Kiểm tra bên dưới rồi bấm "Thêm vào menu ${TYPE_INFO[type].label}".${ai.late ? `\n⚠ ${ai.late} phần ảnh chưa đọc kịp trong 15 giây – chọn lại ảnh để đọc lại.` : ""}\n${ai.info}`);
        q("status").style.whiteSpace = "pre-line";
      } else status(`⚠ AI không dùng được (${aiFail}) nên đã dùng đọc ảnh cơ bản, kết quả có thể sai. ${q("status").textContent}`);
    } catch (e) { status("Lỗi: " + e.message); }
    state.busy = false; q("go").disabled = false;
  };
  q("img").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) runOcr(f); };
  q("text").addEventListener("paste", e => {
    const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/"));
    if (f) { e.preventDefault(); runOcr(f); }
  });
  q("go").onclick = analyze;
}

// Copy vào clipboard; trình duyệt chặn thì copy qua ô ẩn
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove();
    if (!ok) return toast("Không copy được, hãy copy thủ công");
  }
  toast("Đã copy ✓");
}

// state.sid = "<mã1>,<mã2>" hoặc "<mã1>,<mã2>&cap=60"; rỗng = màn hình chọn phiên

function drawPayPick(list) {

    if (!ids.length) return $("#err").textContent = "Chọn ít nhất 1 phiên";
    if (ids.length > 20) return $("#err").textContent = "Tối đa 20 phiên";

// Mỗi người: tiền từng bữa, hỗ trợ (theo suất, có trần thì trừ dần từ bữa sớm nhất), còn phải trả
function payRows(t, cap) {
  const ss = [...t.sessions].sort((a, b) => new Date(a.created) - new Date(b.created));
  const rows = t.people.map(p => {
    let left = cap > 0 ? cap : Infinity, amount = 0, sub = 0, portions = 0;
    const cells = ss.map(s => {
      const c = p.by[s.id];
      if (!c) return null;
      const give = Math.min(left, subsidyOf(s, c.amount, c.portions));
      left -= give; amount += c.amount; sub += give; portions += c.portions;
      return { ...c, s, sub: give, due: c.amount - give };
    });
    const had = cells.filter(Boolean);
    return { ...p, cells, amount, sub, portions, due: amount - sub,
             paid: had.every(c => c.paid), claimed: had.every(c => c.paid || c.claimed) };
  }).sort((a, b) => a.name.localeCompare(b.name, "vi"));
  return { ss, rows };
}
function drawPay() {
  const [idPart, capPart] = state.sid.split("&cap="), ids = idPart.split(","), capK = Number(capPart) || 0;
  const { ss, rows } = payRows(state.data, capK * 1000);
  const me = rows.find(r => r.phone === state.user.phone), sum = f => rows.reduce((a, r) => a + f(r), 0);
  const colName = s => {
    const n = s.shop || s.owner_name;
    return new Date(s.created).toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" }) + " " + (n.length > 16 ? n.slice(0, 15) + "…" : n);
  };
  // Người tạo phiên bấm được "Đã trả" (chỉ đổi ở các phiên của mình); người khác chỉ xem
  const status = r => {
    const own = r.cells.filter(c => c && c.s.owner_phone === state.user.phone), label = p => p ? "✓ Đã trả" : r.claimed ? "Báo chuyển" : "Chưa trả";
    if (!own.length) return `<span class="tag ${r.paid ? "ok" : r.claimed ? "info" : "locked"}">${label(r.paid)}</span>`;
    const p = own.every(c => c.paid);
    return `<button class="chip ${p ? "paid" : ""}" data-pp="${esc(r.phone)}" data-v="${p ? 0 : 1}">${label(p)}</button>`;
  };
  // Phần của tôi: gom các bữa chưa trả theo tài khoản nhận -> mỗi tài khoản một mã QR
  let myCard = "";
  if (me) {
    const unpaid = me.cells.filter(c => c && !c.paid && c.due > 0), groups = {};
    unpaid.forEach(c => { const g = groups[c.s.bank + "|" + c.s.account] ||= { s: c.s, amount: 0 }; g.amount += c.due; });
    const left = unpaid.reduce((a, c) => a + c.due, 0);
    myCard = `<div class="card"><h2>${left ? `Bạn cần trả ${money(left)}` : "✓ Bạn đã trả đủ"}</h2>
      <div class="mute">Tiền món ${money(me.amount)}${me.sub ? ` − Deeyu hỗ trợ ${money(me.sub)}` : ""} = ${money(me.due)}</div>
      ${Object.values(groups).filter(g => g.s.bank && g.s.account).map(g => `<div style="margin-top:14px">${payBoxHtml(g.s, g.amount)}</div>`).join("")}
      ${!unpaid.length ? "" : unpaid.every(c => c.claimed) ? `<div class="tag info mt3" style="display:flex;justify-content:center;padding:8px">Đã báo chuyển – chờ người đặt xác nhận</div>` : `<button class="primary" id="claimAll">${I("check", "sm")} Tôi đã chuyển khoản</button>`}</div>`;
  }
  // Ai thu bao nhiêu (giống "Thu hộ" trong sheet cũ)
  const owners = {};
  rows.forEach(r => r.cells.forEach(c => { if (!c) return; const o = owners[c.s.owner_phone] ||= { name: c.s.owner_name, due: 0, got: 0 }; o.due += c.due; if (c.paid) o.got += c.due; }));
  $("#app").innerHTML = `
    ${myCard}
    <div class="card">
      <div class="row"><h2 class="grow" style="margin:0">${ss.length} bữa · ${rows.length} người</h2><button class="ghost" id="repick">Chọn lại</button></div>
      <div class="tblwrap" style="margin-top:10px"><table class="pay">
        <thead><tr><th>Tên</th>${ss.map(s => `<th>${esc(colName(s))}</th>`).join("")}<th>Suất</th><th>Hỗ trợ</th><th>Cần trả</th><th></th></tr></thead>
        <tbody>${rows.map(r => `<tr class="${r === me ? "me" : ""}"><td>${esc(r.name)}</td>${r.cells.map(c => `<td>${c ? money(c.amount) : ""}</td>`).join("")}<td>${r.portions}</td><td>${money(r.sub)}</td><td><b>${money(r.due)}</b></td><td>${status(r)}</td></tr>`).join("")}</tbody>
        <tfoot><tr><td>Tổng</td>${ss.map((s, i) => `<td>${money(sum(r => r.cells[i]?.amount || 0))}</td>`).join("")}<td>${sum(r => r.portions)}</td><td>${money(sum(r => r.sub))}</td><td>${money(sum(r => r.due))}</td><td>${rows.filter(r => r.paid).length}/${rows.length} đã trả</td></tr></tfoot>
      </table></div>
      <div class="mute" style="margin-top:10px">Tiền món <b>${money(sum(r => r.amount))}</b> · Deeyu hỗ trợ <b>${money(sum(r => r.sub))}</b> · Cần thu <b>${money(sum(r => r.due))}</b><br>
        ${Object.values(owners).map(o => `Thu hộ ${esc(o.name)}: <b>${money(o.due)}</b> (đã nhận ${money(o.got)})`).join("<br>")}</div>
      <div class="row mt3"><button class="ghost grow" id="copyLink">${I("link", "sm")} Copy link bảng</button><button class="ghost plain grow" id="copyTsv">${I("table", "sm")} Copy sang Sheet</button></div>
    </div>
    <div class="card">
      <h2>Trần hỗ trợ mỗi người</h2>
      <div class="row"><input id="cap" type="number" inputmode="numeric" min="0" class="grow" placeholder="Nghìn đồng, VD: 60" value="${capK || ""}"><button class="ghost" id="capOk">Áp dụng</button></div>
      <div class="mute" style="margin-top:4px">VD mỗi người được hỗ trợ tối đa 3 bữa = 60. Trừ dần từ bữa sớm nhất. Để trống = không giới hạn. Trần nằm trong link bảng nên ai mở link cũng thấy cùng số tiền.</div>
    </div>`;
  paintQrs();
  $("#repick").onclick = () => go("pay", "");
  $("#copyLink").onclick = () => copyText(location.href);
  $("#copyTsv").onclick = () => {
    // Dán vào Google Sheet: mỗi ô một cột, số tiền dạng số (đồng)
    const lines = [["Tên", ...ss.map(colName), "Số suất", "Hỗ trợ", "Thanh toán", "Đã trả"],
      ...rows.map(r => [r.name, ...r.cells.map(c => c ? c.amount : ""), r.portions, r.sub, r.due, r.paid ? "TRUE" : "FALSE"]),
      ["Tổng", ...ss.map((s, i) => sum(r => r.cells[i]?.amount || 0)), sum(r => r.portions), sum(r => r.sub), sum(r => r.due), rows.filter(r => r.paid).length]];
    copyText(lines.map(a => a.map(x => String(x).replace(/[\t\n]/g, " ")).join("\t")).join("\n"));
  };
  $("#capOk").onclick = () => {
    state.sid = paySid(ids, Math.max(0, Math.round(Number($("#cap").value) || 0)));
    history.replaceState({ ...history.state, sid: state.sid }, "", urlOf("pay", state.sid));
    drawPay();
  };
  document.querySelectorAll("[data-pp]").forEach(b => b.onclick = async () => {
    const ph = b.dataset.pp, v = b.dataset.v === "1", person = state.data.people.find(p => p.phone === ph);
    const mine = state.data.sessions.filter(s => s.owner_phone === state.user.phone && person?.by[s.id]), old = mine.map(s => person.by[s.id].paid);
    mine.forEach(s => person.by[s.id].paid = v); drawPay();
    try { await api("setPaidMany", { ids, orderPhone: ph, paid: v }); }
    catch (e) { mine.forEach((s, i) => person.by[s.id].paid = old[i]); drawPay(); toast(e.message); }
  });
  if ($("#claimAll")) $("#claimAll").onclick = async () => {
    const b = $("#claimAll"); b.disabled = true;
    try { await api("claimPaid", { ids: me.cells.filter(c => c && !c.paid && c.due > 0).map(c => c.s.id) }); toast("Đã báo người đặt ✓"); await viewPay(); }
    catch (e) { toast(e.message); b.disabled = false; }
  };
}

const start = fromHash();
history.replaceState({ ...start, d: 0 }, "", urlOf(start.view, start.sid));
show(start);
</script>
</body>
</html>
