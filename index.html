<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ef">
<title>Deeyu Food - Đặt cơm & nước</title>
<link rel="icon" type="image/png" href="img/favicon-48.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== TOKEN: màu (một màu nhấn xanh navy theo logo Youth Union DEE, còn lại trung tính ấm), bo góc, bóng, khoảng cách 4/8/12/16/24 ===== */
  :root {
    --bg:#f7f4ef; --card:#fff; --ink:#1f1a14; --ink2:#4a4037; --mute:#74685a; --line:#ece5dc; --line2:#d9cfc2; --sunk:#f3eee7;
    --brand:#1b0e5e; --brand-h:#120944; --brand2:#eeecf8; --brand3:#dcd8f0; --brand-rgb:27,14,94; --brand-l:#3f3291;
    --ok:#237a35; --ok2:#e7f6ea; --warn:#9a4a00; --warn2:#fff4e6; --bad:#c92a2a; --bad2:#ffeded; --info:#1864ab; --info2:#e7f3ff;
    --r-sm:10px; --r:14px; --r-lg:18px;
    --sh:0 1px 2px rgba(31,26,20,.04), 0 4px 14px rgba(31,26,20,.05);
    --sh2:0 2px 4px rgba(31,26,20,.05), 0 10px 28px rgba(31,26,20,.09);
    --sh-up:0 -4px 20px rgba(31,26,20,.07);
    --ring:0 0 0 4px rgba(var(--brand-rgb),.16);
    --head:60px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:15px/1.5 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .ic { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; vertical-align:-4px; }
  .ic.sm { width:16px; height:16px; vertical-align:-3px; }
  .ic.lg { width:24px; height:24px; }
  .num, .tot, .statrow b, table.pay, .kpi b { font-variant-numeric:tabular-nums; }

  /* ===== HEADER ===== */
  header { position:sticky; top:0; z-index:5; height:var(--head); padding:0 12px 0 8px; display:flex; align-items:center; gap:4px; background:rgba(247,244,239,.9); -webkit-backdrop-filter:saturate(1.4) blur(12px); backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line); }
  header h1 { flex:1; min-width:0; margin:0 0 0 8px; font-size:17px; font-weight:700; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #navBtns { display:flex; align-items:center; gap:2px; flex:none; }
  .iconbtn { width:40px; height:40px; border:0; border-radius:12px; background:transparent; color:var(--ink2); display:grid; place-items:center; padding:0; flex:none; transition:background .15s; }
  .iconbtn:hover { background:rgba(31,26,20,.06); }
  .iconbtn:active { background:rgba(31,26,20,.1); }
  .iconbtn:disabled { opacity:.3; }
  .avatar { width:32px; height:32px; border-radius:50%; display:inline-grid; place-items:center; background:var(--brand2); color:var(--brand); font-weight:700; font-size:13px; flex:none; }
  .avatar.sm { width:28px; height:28px; font-size:12px; }
  .avatar.a1 { background:var(--info2); color:var(--info); } .avatar.a2 { background:var(--warn2); color:var(--warn); }
  .avatar.a3 { background:#e6fcf5; color:#087f5b; } .avatar.a4 { background:#fff0f6; color:#a61e4d; }
  #userBadge { margin:0 4px; }
  #brandLogo { width:36px; height:36px; margin-left:6px; flex:none; cursor:pointer; }

  /* ===== BỐ CỤC CHUNG ===== */
  main { max-width:640px; margin:0 auto; padding:12px 16px 136px; }
  @media (min-width:768px) { main { padding:24px 24px 136px; } }
  .card { background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh); padding:16px; margin-bottom:12px; }
  h2 { font-size:16px; font-weight:700; letter-spacing:-.01em; line-height:1.3; margin:0 0 8px; }
  h2 .ic { color:var(--mute); margin-right:4px; }
  .sect { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); margin:24px 4px 10px; }
  .row { display:flex; align-items:center; gap:12px; }
  .grow, .row .grow { flex:1; min-width:0; }
  .mute { color:var(--mute); font-size:14px; }
  .mt1 { margin-top:4px !important; } .mt2 { margin-top:8px !important; } .mt3 { margin-top:12px !important; } .mt4 { margin-top:16px !important; }
  /* nút phụ đứng cạnh nút chính trong một hàng: cao bằng nhau */
  .row > button.ghost:has(~ button.primary), .row > button.primary ~ button.ghost { min-height:50px; }
  label.chk + label.chk { border-top:1px solid var(--line); }
  .w100 { width:100%; } .center { text-align:center; } .pre { white-space:pre-line; }
  .hidden { display:none !important; }

  /* ===== Ô NHẬP ===== */
  label { display:block; font-size:13px; font-weight:600; color:var(--ink2); margin:16px 0 6px 2px; }
  input, textarea, select { width:100%; min-height:48px; padding:11px 14px; border:1.5px solid var(--line2); border-radius:var(--r); font:inherit; font-size:16px; background:#fff; color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s; }
  input:hover, textarea:hover, select:hover { border-color:#c9bdae; }
  input:focus, textarea:focus, select:focus { border-color:var(--brand); box-shadow:var(--ring); }
  input::placeholder, textarea::placeholder { color:#9c8f81; }
  textarea { min-height:110px; resize:vertical; }
  input[readonly], input:disabled, textarea:disabled { background:var(--sunk); color:var(--ink2); }
  input[type=checkbox] { width:20px; height:20px; min-height:0; padding:0; margin:0; accent-color:var(--brand); flex:none; box-shadow:none; }
  input[type=file] { min-height:0; padding:8px; font-size:14px; border-style:dashed; background:#fffcf8; color:var(--mute); }
  input[type=file]::file-selector-button { border:0; background:var(--brand2); color:var(--brand); font:inherit; font-weight:600; padding:8px 14px; border-radius:var(--r-sm); margin-right:12px; }
  .search { position:relative; }
  .search .ic { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--mute); pointer-events:none; }
  .search input { padding-left:42px; border-color:transparent; box-shadow:var(--sh); }
  .search input:focus { border-color:var(--brand); box-shadow:var(--ring); }

  /* ===== NÚT ===== */
  button { font:inherit; color:inherit; }
  button.primary, a.btnlink { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; margin-top:12px; padding:0 20px; border:0; border-radius:var(--r); background:var(--brand); color:#fff; font-weight:600; font-size:15px; text-decoration:none; box-shadow:0 4px 14px rgba(var(--brand-rgb),.25); transition:background .15s, transform .1s, box-shadow .15s; }
  button.primary:hover, a.btnlink:hover { background:var(--brand-h); }
  button.primary.fit { width:auto; margin-top:0; flex:none; }
  button.primary.danger { background:var(--bad); box-shadow:0 4px 14px rgba(201,42,42,.22); }
  button.ghost { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:0 14px; white-space:nowrap; border:0; border-radius:12px; background:var(--brand2); color:var(--brand); font-weight:600; font-size:14px; transition:background .15s, transform .1s; }
  button.ghost:hover { background:var(--brand3); }
  button.ghost.plain { background:#fff; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line2); }
  button.ghost.plain:hover { background:#faf7f2; }
  button.ghost.paid { background:var(--ok2); color:var(--ok); }
  button.ghost.danger { background:var(--bad2); color:var(--bad); }
  button.ghost.sq { width:50px; min-height:50px; padding:0; border-radius:var(--r); flex:none; }
  button:active:not(:disabled) { transform:scale(.97); }
  button:disabled { opacity:.5; box-shadow:none; }
  button, select, summary, [data-id], input[type=file], input[type=file]::file-selector-button, label[for], label.chk { cursor:pointer; }
  button:disabled { cursor:not-allowed; }
  button:focus-visible, a:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .spin { width:16px; height:16px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; display:inline-block; animation:rot .7s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }

  /* ===== NHÃN TRẠNG THÁI ===== */
  .tag { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--brand2); color:var(--brand); white-space:nowrap; flex:none; }
  .tag::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .tag.ok { background:var(--ok2); color:var(--ok); }
  .tag.locked { background:var(--bad2); color:var(--bad); }
  .tag.info { background:var(--info2); color:var(--info); }
  .tag.gray { background:var(--sunk); color:var(--mute); }
  .req { color:var(--bad); font-weight:700; }
  .err { color:var(--bad); font-size:13.5px; margin-top:8px; min-height:1em; }

  /* ===== TAB (segmented) và BƯỚC ===== */
  .tabs { display:flex; gap:2px; background:#ece6dd; padding:4px; border-radius:var(--r); margin-bottom:12px; }
  .tabs button { flex:1; min-width:0; min-height:40px; padding:6px 8px; border:0; border-radius:11px; background:transparent; color:var(--mute); font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; transition:background .15s, color .15s; }
  .tabs button:hover { color:var(--ink); }
  .tabs button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(31,26,20,.12); }
  .tabs.sm button { font-size:13px; }
  .tabs.five button { flex-direction:column; gap:2px; min-height:54px; font-size:12px; line-height:1.2; }
  .tabs.five button.on { color:var(--brand); }
  .steps { display:flex; margin:4px 0 16px; }
  .steps button { flex:1; position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; border:0; background:none; padding:0; font-size:12.5px; font-weight:600; color:var(--mute); }
  .steps button::before { content:""; position:absolute; z-index:0; top:15px; left:-50%; right:50%; height:2px; background:var(--line2); }
  .steps button:first-child::before { display:none; }
  .steps .n { position:relative; z-index:1; width:32px; height:32px; border-radius:50%; display:grid; place-items:center; background:#fff; box-shadow:inset 0 0 0 2px var(--line2); font-size:13px; font-weight:700; }
  .steps button.done::before, .steps button.on::before { background:var(--brand); }
  .steps button.done .n { background:var(--brand2); color:var(--brand); box-shadow:none; }
  .steps button.on { color:var(--ink); }
  .steps button.on .n { background:var(--brand); color:#fff; box-shadow:0 0 0 4px rgba(var(--brand-rgb),.15); }
  .steps button:disabled { opacity:1; }
  .step { font-weight:700; font-size:14px; color:var(--ink2); margin:18px 0 8px; }

  /* ===== CHIP, CHECKBOX, DROPDOWN ===== */
  .chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; min-height:40px; padding:6px 14px; border:1.5px solid var(--line2); border-radius:12px; background:#fff; color:var(--ink); font-weight:500; font-size:14px; transition:border-color .15s, background .15s; }
  .chip:hover { border-color:#b9ac9c; }
  .chip.on { border-color:var(--brand); background:var(--brand2); color:var(--brand); font-weight:600; }
  .chip.paid { border-color:transparent; background:var(--ok2); color:var(--ok); }
  label.chk { display:flex; align-items:center; gap:12px; margin:0; padding:10px 0; color:var(--ink); font-size:15px; font-weight:400; }
  details.dd { border:1.5px solid var(--line2); border-radius:12px; background:#fff; padding:0 14px; }
  details.dd summary { padding:10px 0; list-style:none; font-size:14px; font-weight:500; }
  details.dd summary::-webkit-details-marker { display:none; }
  details.dd summary::after { content:"▾"; float:right; color:var(--mute); }
  details.dd[open] summary::after { content:"▴"; }
  .ddbox { border-top:1px solid var(--line); padding:4px 0 6px; }
  details > summary { list-style:none; }

  /* ===== ĐĂNG NHẬP ===== */
  .hero { padding:36px 4px 20px; }
  .logo { display:block; width:112px; height:112px; margin:0 0 16px -6px; }
  .hero .org { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--brand); margin:0 0 4px; }
  .hero h2 { font-size:28px; font-weight:800; letter-spacing:-.02em; margin:0; }
  .hero p { color:var(--ink2); font-size:15.5px; margin:6px 0 0; max-width:320px; }

  /* ===== TRANG CHỦ ===== */
  .hello { margin:4px 2px 0; }
  .hello .h { font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.2; margin:0; }
  .create { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0 0; }
  .create button { border:0; text-align:left; color:#fff; background:var(--brand); border-radius:var(--r-lg); padding:14px; display:flex; flex-direction:column; align-items:flex-start; gap:12px; font-weight:600; font-size:15px; line-height:1.25; box-shadow:0 6px 18px rgba(var(--brand-rgb),.25); transition:transform .1s, background .15s; }
  .create button:hover { background:var(--brand-h); }
  .create button.alt { background:var(--ink); box-shadow:0 6px 18px rgba(31,26,20,.18); }
  .create button.alt:hover { background:#3a3128; }
  .create .ib { width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.18); display:grid; place-items:center; }
  .sess { display:flex; gap:12px; transition:transform .1s, box-shadow .15s; }
  .sess:hover { box-shadow:var(--sh2); }
  .sess:active { transform:scale(.99); }
  .thumb { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; flex:none; background:var(--brand2); color:var(--brand); }
  .thumb.nuoc { background:var(--info2); color:var(--info); }
  .thumb.dim { background:var(--sunk); color:var(--mute); }
  .sess .t { display:flex; align-items:center; gap:8px; }
  .sess .t b { flex:1; min-width:0; font-size:15.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { display:flex; flex-wrap:wrap; gap:2px 12px; font-size:13px; color:var(--mute); margin-top:4px; }
  .meta > span { display:inline-flex; align-items:center; gap:5px; }
  .meta .warn { color:var(--warn); font-weight:600; }
  .meta .gift { color:var(--ok); }
  .links { padding:4px 0; overflow:hidden; }
  .links button { width:100%; display:flex; align-items:center; gap:12px; padding:12px 16px; border:0; background:none; text-align:left; color:var(--ink); font-weight:600; }
  .links button + button { border-top:1px solid var(--line); }
  .links button:hover { background:#faf7f2; }
  .links .li { width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:var(--sunk); color:var(--ink2); flex:none; }
  .links .tx { flex:1; min-width:0; }
  .links .tx span { display:block; font-size:12.5px; font-weight:400; color:var(--mute); }
  .links > button > .ic:last-child { color:var(--mute); }
  .skel { display:grid; gap:10px; }
  .skel i { display:block; height:14px; border-radius:7px; background:linear-gradient(90deg, #efe9e1 25%, #f8f4ef 50%, #efe9e1 75%); background-size:200% 100%; animation:shim 1.2s linear infinite; }
  .skel i:first-child { width:55%; height:16px; }
  .skel i:last-child { width:35%; }
  @keyframes shim { to { background-position:-200% 0; } }
  .empty { text-align:center; padding:28px 16px; color:var(--mute); font-size:14px; }
  .empty .ic { width:32px; height:32px; color:#b9ac9c; display:block; margin:0 auto 8px; }

  /* ===== PHIÊN ===== */
  .sesshead { margin:4px 2px 16px; }
  .sesshead .by { display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--mute); }
  .infochips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .ichip { display:inline-flex; align-items:center; gap:6px; background:#fff; border-radius:99px; padding:6px 12px; font-size:13px; font-weight:500; color:var(--ink2); box-shadow:var(--sh); }
  .ichip:empty { display:none; }
  .ichip.warn { background:var(--warn2); color:var(--warn); box-shadow:none; font-weight:600; }
  .ichip.gift { background:var(--ok2); color:var(--ok); box-shadow:none; font-weight:600; }
  .callout { display:flex; gap:10px; background:#fffaf0; border:1px solid #f3e1c0; border-radius:var(--r); padding:12px 14px; font-size:13.5px; color:#6e4f12; margin-bottom:12px; }
  .callout b { color:#5a3f0a; }
  .callout .ic { margin-top:1px; }
  .shopname { font-weight:800; font-size:20px; letter-spacing:-.02em; margin:4px 2px 10px; }
  .pagehead { font-size:19px; font-weight:700; margin:4px 2px 10px; }
  .finder { position:sticky; top:var(--head); z-index:4; background:var(--bg); margin:0 -16px 8px; padding:10px 16px 6px; }
  .cat { font-weight:700; color:var(--ink); font-size:16px; margin:18px 0 2px; scroll-margin-top:calc(var(--head) + 120px); }
  .cat:first-child { margin-top:2px; }
  .item { padding:14px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border:0; }
  .item .n { font-weight:600; font-size:15px; }
  .item.in .n { color:var(--brand); }
  .item .p { font-weight:700; font-size:14px; margin-top:2px; }
  .item input.note { margin-top:8px; min-height:40px; padding:8px 12px; border-radius:12px; }
  button.add { width:40px; height:40px; border-radius:50%; border:1.5px solid var(--brand); background:#fff; color:var(--brand); display:grid; place-items:center; padding:0; flex:none; transition:background .15s, color .15s, transform .1s; }
  button.add:hover:not(:disabled) { background:var(--brand); color:#fff; }
  .qty { display:inline-flex; align-items:center; background:var(--sunk); border-radius:99px; padding:2px; flex:none; }
  .qty button { width:36px; height:36px; border-radius:50%; border:0; background:transparent; color:var(--ink); display:grid; place-items:center; padding:0; }
  .qty button:hover:not(:disabled) { background:#fff; }
  .qty span { min-width:24px; text-align:center; font-weight:700; font-size:14px; }
  .line { margin-top:10px; padding:10px 12px; background:#faf7f2; border-radius:12px; }
  .line .qty { background:#fff; }
  .line .qty button:hover:not(:disabled) { background:var(--sunk); }
  .person { display:flex; gap:12px; align-items:flex-start; }
  .person .avatar { margin-top:2px; }

  /* ===== THANH DƯỚI ===== */
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; box-shadow:var(--sh-up); border-radius:20px 20px 0 0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar > div { max-width:640px; margin:0 auto; }
  .bar button.primary { margin-top:0; }
  .cartbox { max-height:45vh; overflow:auto; border-bottom:1px solid var(--line); margin-bottom:12px; padding-bottom:4px; }
  .cartbox .row { padding:8px 0; }
  .cartbox .row + .row { border-top:1px solid var(--line); }
  .cartbar { display:flex; align-items:center; gap:10px; }
  button.cartsum { flex:1; min-width:0; display:flex; align-items:center; gap:12px; border:0; background:none; padding:0; text-align:left; color:var(--ink); }
  button.cartsum:disabled { opacity:1; cursor:default; }
  .bag { position:relative; width:46px; height:46px; border-radius:14px; background:var(--brand2); color:var(--brand); display:grid; place-items:center; flex:none; }
  .badge { position:absolute; top:-5px; right:-5px; min-width:20px; height:20px; padding:0 5px; border-radius:99px; background:var(--brand); color:#fff; font-size:11.5px; font-weight:700; display:grid; place-items:center; border:2px solid #fff; }
  .tot { display:block; font-size:19px; font-weight:800; letter-spacing:-.01em; line-height:1.2; white-space:nowrap; }
  .tot small { font-size:12px; font-weight:600; color:var(--ok); letter-spacing:0; margin-left:4px; }
  .hint { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:12px; color:var(--mute); line-height:1.35; }
  .hint.ok { color:var(--ok); font-weight:600; }
  .hint.bad { color:var(--bad); font-weight:600; }

  /* ===== Ô TRƯỢT TỪ DƯỚI (thay confirm) + TOAST ===== */
  .sheet-bg { position:fixed; inset:0; z-index:20; background:rgba(31,26,20,.42); opacity:0; transition:opacity .18s ease-out; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; max-width:520px; margin:0 auto; background:#fff; border-radius:24px 24px 0 0; padding:10px 20px calc(20px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .22s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 40px rgba(31,26,20,.15); }
  .sheet-bg.show { opacity:1; } .sheet.show { transform:none; }
  .sheet .grab { width:40px; height:4px; border-radius:4px; background:var(--line2); margin:0 auto 16px; }
  .sheet .msg { font-size:15.5px; white-space:pre-line; margin:0 0 20px; }
  .sheet .acts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .sheet .acts button { margin:0; min-height:50px; }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); max-width:calc(100% - 32px); width:max-content; text-align:center; background:var(--ink); color:#fff; padding:10px 16px; border-radius:99px; font-size:14px; font-weight:500; z-index:30; box-shadow:0 8px 24px rgba(31,26,20,.25); animation:toastIn .18s ease-out; }
  @keyframes toastIn { from { opacity:0; transform:translate(-50%, 8px); } }

  /* ===== QUẢN LÝ, THỐNG KÊ, THANH TOÁN ===== */
  .kpis { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px; }
  .kpi { background:#fff; border-radius:var(--r); padding:12px; box-shadow:var(--sh); }
  .kpi span { display:block; font-size:12px; font-weight:500; color:var(--mute); }
  .kpi b { font-size:20px; font-weight:800; letter-spacing:-.01em; }
  .prog { height:8px; border-radius:99px; background:#efe9e1; overflow:hidden; margin:10px 0 6px; }
  .prog > div { height:100%; border-radius:99px; background:var(--ok); transition:width .3s ease-out; }
  .statrow { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 0; font-size:14.5px; }
  .statrow.big span { font-weight:600; color:var(--ink2); }
  .statrow.big b { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  pre.sum { background:#faf7f2; border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; white-space:pre-wrap; font:14px/1.6 "Be Vietnam Pro", system-ui, sans-serif; color:var(--ink2); margin:8px 0 12px; }
  img.qr { width:220px; max-width:100%; display:block; margin:12px auto; border-radius:12px; }
  .qrbox { text-align:center; }
  .bankapps { margin:4px 0 12px; }
  .bankapps .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:8px; }
  .bankapps a { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px; border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; font-size:11px; line-height:1.2; }
  .bankapps a img { width:40px; height:40px; border-radius:10px; }
  .bankapps a small { color:var(--mute); font-size:10px; }
  .bankapps .more { margin-top:8px; background:none; border:0; color:var(--brand); font-weight:600; font-size:13px; }
  .kv { display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:44px; padding:6px 0; border-top:1px solid var(--line); font-size:13.5px; text-align:left; }
  .kv span { color:var(--mute); flex:none; }

  .tblwrap { overflow-x:auto; margin:0 -16px; padding:0 16px; }
  table.pay { border-collapse:collapse; font-size:14px; white-space:nowrap; min-width:100%; }
  table.pay th, table.pay td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:right; }
  table.pay th { color:var(--mute); font-size:12px; font-weight:600; }
  table.pay th:first-child, table.pay td:first-child { text-align:left; position:sticky; left:0; background:var(--card); }
  table.pay tr.me td { background:var(--brand2); }

<script>
/* ===== CẤU HÌNH ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbzCbe5gifV9WYR1dlZx-lCs0wj1z2vmhyx2jj2XW3PvxizkaZ3ptjg4jnV1meSSYdQ/exec";               // Dán URL Web App của Apps Script vào đây
const DEFAULT_PLACE = "Cổng chui Bách Khoa";

// [mã, tên, BIN trong mã VietQR]
const BANKS = [
  ["MOMO","Ví MoMo",""],["VCB","Vietcombank","970436"],["TCB","Techcombank","970407"],["MB","MB Bank","970422"],["ACB","ACB","970416"],
  ["BIDV","BIDV","970418"],["CTG","VietinBank","970415"],["VBA","Agribank","970405"],["VPB","VPBank","970432"],["TPB","TPBank","970423"],
  ["STB","Sacombank","970403"],["VIB","VIB","970441"],["SHB","SHB","970443"],["HDB","HDBank","970437"],["MSB","MSB","970426"],
  ["OCB","OCB","970448"],["EIB","Eximbank","970431"],["LPB","LPBank","970449"],["SEAB","SeABank","970440"],["NAB","Nam A Bank","970428"],
  ["BAB","BacABank","970409"],["ABB","ABBank","970425"],["VAB","VietABank","970427"],["PVCB","PVcomBank","970412"],["SCB","SCB","970429"],
  ["NCB","NCB","970419"],["KLB","Kienlongbank","970452"],["PGB","PGBank","970430"],["VCCB","Viet Capital Bank","970454"],
  ["BVB","BaoVietBank","970438"],["CAKE","CAKE by VPBank","546034"],["UBANK","Ubank by VPBank","546035"],["TIMO","Timo","963388"]
];
const bankLabel = c => { const b = BANKS.find(x => x[0] === c); return b ? `${b[0]} - ${b[1]}` : c; };
// "VCB - Vietcombank" / "vcb" / "vietcombank" / "momo" -> mã ngân hàng, hoặc "" nếu không có trong danh sách
const bankFromInput = v => {
  v = String(v || "").trim().toLowerCase().replace(/\s+/g, " ");
  const b = BANKS.find(x => v === x[0].toLowerCase() || v === x[1].toLowerCase() || v === `${x[0]} - ${x[1]}`.toLowerCase() || (v === "mo mo" && x[0] === "MOMO"));
  return b ? b[0] : "";
};

/* ===== TIỆN ÍCH ===== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
// Icon nét từ bộ <symbol> đầu trang: I("plus"), I("clock", "sm")
const I = (n, c = "") => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
// Ảnh đại diện chữ cái đầu, màu cố định theo SĐT
const ini = n => esc(String(n || "?").trim().charAt(0).toUpperCase() || "?");
const avc = p => "a" + [...String(p || "")].reduce((a, c) => a + c.charCodeAt(0), 0) % 5;
const avatar = (name, phone, sm = true) => `<span class="avatar ${sm ? "sm" : ""} ${avc(phone)}">${ini(name)}</span>`;
// Khung xương khi đang tải
// Thanh các bước: số tròn nối bằng vạch, bước đã qua có dấu ✓. base = số của bước đầu trong data-step
const stepsHtml = (labels, cur, enabled, base = 0) => `<div class="steps">${labels.map((l, i) =>
  `<button data-step="${i + base}" class="${i === cur ? "on" : i < cur ? "done" : ""}" ${enabled(i) ? "" : "disabled"} ${i === cur ? 'aria-current="step"' : ""}><span class="n">${i < cur ? I("check", "sm") : i + 1}</span>${l}</button>`).join("")}</div>`;
const skel = (n = 3) => Array(n).fill(`<div class="card skel"><i></i><i></i><i></i></div>`).join("");
// Hộp hỏi lại dạng ô trượt từ dưới (thay confirm của trình duyệt). Trả Promise<boolean>
function ask(msg, okLabel = "Đồng ý", danger = false) {
  return new Promise(done => {
    const bg = document.createElement("div"), sh = document.createElement("div");
    bg.className = "sheet-bg"; sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true");
    sh.innerHTML = `<div class="grab"></div><div class="msg"></div><div class="acts"><button class="ghost plain" data-no>Hủy</button><button class="primary ${danger ? "danger" : ""}" data-yes></button></div>`;
    $(".msg", sh).textContent = msg; $("[data-yes]", sh).textContent = okLabel;
    const close = v => { bg.classList.remove("show"); sh.classList.remove("show"); document.removeEventListener("keydown", key); setTimeout(() => { bg.remove(); sh.remove(); }, 220); done(v); };
    const key = e => { if (e.key === "Escape") close(false); };
    bg.onclick = () => close(false); $("[data-no]", sh).onclick = () => close(false); $("[data-yes]", sh).onclick = () => close(true);
    document.addEventListener("keydown", key);
    document.body.append(bg, sh);
    requestAnimationFrame(() => { bg.classList.add("show"); sh.classList.add("show"); $("[data-yes]", sh).focus(); });
  });
}
// Mọi giá hiển thị theo ngàn đồng: 35000 -> "35K", 12500 -> "12.5K"
const money = n => { const k = Number(n) / 1000; return (Number.isInteger(k) ? k : +k.toFixed(1)) + "K"; };
const normPhone = p => { p = String(p || "").replace(/[\s.\-()]/g, "").replace(/^\+84/, "0").replace(/^84/, "0"); return /^0\d{9}$/.test(p) ? p : ""; };
// Bỏ dấu: "Trà đào" -> "Tra dao" (tìm món không dấu, nội dung chuyển khoản)
const unaccent = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
const fold = s => unaccent(s).toLowerCase();
// Nội dung chuyển khoản: "HOANG 0901234567" (ngân hàng giới hạn ~25 ký tự, không dấu)
const transferNote = () => {
  let n = unaccent(state.user.name).replace(/[^A-Za-z0-9 ]/g, "").replace(/\s+/g, " ").trim().toUpperCase();
  if (n.length > 14) n = n.slice(0, 15).replace(/\s*\S*$/, "") || n.slice(0, 14);   // cắt ở khoảng trắng, không cắt giữa chữ
  return (n ? n + " " : "") + state.user.phone;
};
// "10:30" -> ISO của hôm nay lúc 10:30 (đã qua hơn 1 tiếng thì hiểu là ngày mai); không hợp lệ -> ""
// Giờ nhập theo 24 giờ: "930" / "9:30" / "09:30" -> "09:30"; sai hoặc ngoài 00:00–23:59 -> ""
const normTime = v => {
  const m = String(v).trim().match(/^(\d{1,2})[:h.]?(\d{2})$/);
  return m && +m[1] < 24 && +m[2] < 60 ? m[1].padStart(2, "0") + ":" + m[2] : "";
};
document.addEventListener("focusout", e => { if (e.target.matches?.("[data-time]")) e.target.value = normTime(e.target.value) || e.target.value; });
const timeToIso = hm => {
  hm = normTime(hm);
  if (!hm) return "";
  const d = new Date(); d.setHours(+hm.slice(0, 2), +hm.slice(3), 0, 0);
  if (d < Date.now() - 3600e3) d.setDate(d.getDate() + 1);
  return d.toISOString();
};
const isoToTime = iso => { const d = new Date(iso); return iso && !isNaN(d) ? d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", hour12: false }) : ""; };
// "Chốt 10:30 · còn 25 phút" / "Quá giờ chốt 10:30"
function dlText(iso, status) {
  const hm = isoToTime(iso);
  if (!hm) return "";
  if (status !== "open") return `Giờ chốt ${hm}`;
  const m = Math.round((new Date(iso) - Date.now()) / 60000);
  if (m < 0) return `Quá giờ chốt ${hm}`;
  return `Chốt ${hm} · còn ${m < 60 ? m + " phút" : Math.floor(m / 60) + " giờ" + (m % 60 ? " " + (m % 60) + " phút" : "")}`;
}
const dlSpan = s => s.deadline ? `${I("clock", "sm")}<span data-dl="${esc(s.deadline)}" data-st="${esc(s.status)}">${dlText(s.deadline, s.status)}</span>` : "";
setInterval(() => document.querySelectorAll("[data-dl]").forEach(el => el.textContent = dlText(el.dataset.dl, el.dataset.st)), 30000);
const store = {
  get() { try { return JSON.parse(localStorage.getItem("deeyu_user")); } catch { return null; } },
  set(u) { try { localStorage.setItem("deeyu_user", JSON.stringify(u)); } catch {} },
  clear() { try { localStorage.removeItem("deeyu_user"); } catch {} }
};
// Ghi nhớ trên máy: tên quán đã dùng + thông tin nhận tiền gần nhất
const mem = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("deeyu_" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("deeyu_" + k, JSON.stringify(v)); } catch {} }
};

async function api(action, payload = {}) {
  if (!API_URL) throw new Error("Chưa cấu hình API_URL trong index.html");
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, phone: state.user?.phone, token: state.user?.token, ...payload })
  });
  const j = await res.json();
  if (!j.ok) {
    if (j.error === "Hành động không hợp lệ") throw new Error("Backend chưa cập nhật: dán lại apps-script/Code.gs vào Apps Script rồi Triển khai → Quản lý bản triển khai → Phiên bản mới");
    // Token sai / hết hạn (VD vừa đổi PIN): đăng xuất, quay về màn hình đăng nhập
    if (/^AUTH/.test(j.error) && action !== "login" && state.user) { store.clear(); state.user = null; go("login", null, true); }
    throw new Error(String(j.error).replace(/^AUTH:\s*/, ""));
  }
  return j.data;
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  // Nổi trên thanh dưới (cao thấp tùy có 1 hay 2 nút) thay vì đè lên nó
  const bar = $("#barHost .bar");
  if (bar) t.style.bottom = bar.offsetHeight + 12 + "px";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// Điều hướng gắn với lịch sử trình duyệt: nút Back của điện thoại = lùi màn hình; link "#s=<mã phiên>" mở thẳng phiên đó
// Bảng thanh toán: "#pay=<mã1>,<mã2>&cap=60" (cap = trần hỗ trợ, nghìn đồng) -> gửi link là mọi người thấy cùng một bảng
const urlOf = (view, sid) => view === "session" ? "#s=" + sid : view === "create" ? "#new" + (state.newKind === "nuoc" ? "=nuoc" : "") : view === "pay" ? "#pay=" + (sid || "") : view === "stats" ? "#stats" : view === "addmenu" ? "#menu" : location.pathname + location.search;
function fromHash() {
  const m = location.hash.match(/^#s=([\w-]+)/), p = location.hash.match(/^#pay(?:=([\w,&=-]*))?$/), n = location.hash.match(/^#new(=nuoc)?$/);
  if (m) return { view: "session", sid: m[1] };
  if (p) return { view: "pay", sid: p[1] || "" };
  if (n) { state.newKind = n[1] ? "nuoc" : "com"; return { view: "create", sid: null }; }
  return { view: location.hash === "#stats" ? "stats" : location.hash === "#menu" ? "addmenu" : "home", sid: null };
}

function show({ view, sid }) {
  clearInterval(state.timer);
  state.view = view; state.sid = sid; state.data = null; state.q = ""; state.cartOpen = false; state.cartDirty = false; saver.msg = "";
  render();
}
let maxD = 0;   // trang sâu nhất đã đi tới, để biết còn trang phía sau cho nút ➡ hay không
function go(view, sid = null, reset = false) {
  if (state.view === "session" && state.cartDirty && !confirm("Bạn chưa bấm Đặt – đơn chưa được lưu. Vẫn rời màn hình này?")) return;
  const d = reset ? 0 : (history.state?.d ?? 0) + 1;
  maxD = d;
  history[reset ? "replaceState" : "pushState"]({ view, sid, d }, "", urlOf(view, sid));
  show({ view, sid });
}
window.addEventListener("popstate", e => show(e.state || fromHash()));

function render() {
  const u = state.user;
  $("#navBtns").classList.toggle("hidden", !u);

  $("#brandLogo").classList.toggle("hidden", !u || d > 0);

}

  $("#title").textContent = "Deeyu Food";

    </div>

      <label for="phone" style="margin-top:0">Số điện thoại</label>

    </div>`;
  ($("#name") || $("#phone")).focus();
  if ($("#other")) $("#other").onclick = () => viewLogin();
  $("#go").onclick = async () => {
    const err = m => $("#err").textContent = m;
    const p = normPhone($("#phone").value);
    if (!p) return err("Số điện thoại phải gồm 10 số, bắt đầu bằng 0");
    const body = {};
    if (stage === "register" && !(body.name = $("#name").value.trim())) return err("Nhập tên của bạn");
    $("#go").disabled = true;
    try {
      state.user = { phone: p };

      if (r.stage === "register") { state.user = null; return viewLogin("register", p); }
      if (r.stage) throw new Error("Backend Apps Script chưa cập nhật bản không PIN – hãy dán lại Code.gs và triển khai lại");
      state.user = { phone: r.phone, name: r.name, token: r.token };
      store.set(state.user);
      // Máy mới: lấy tài khoản nhận tiền đã lưu trên server để điền sẵn khi tạo phiên
      if (r.account && !mem.get("bank", null)) mem.set("bank", { bank: r.bank, account: r.account, acc_name: r.acc_name });
      const t = fromHash();   // mở bằng link phiên -> vào thẳng phiên đó
      go(t.view, t.sid, true);
    } catch (e) { state.user = null; err(e.message); $("#go").disabled = false; }
  };
}

const STAT_RANGES = [["week", "Tuần này"], ["month", "Tháng này"], ["all", "Tất cả"]];
function statsSince(range) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (range === "week") d.setDate(d.getDate() - (d.getDay() + 6) % 7);   // thứ Hai
  else if (range === "month") d.setDate(1);
  else return "";
  return d.toISOString();
}

  catch (e) { if ($("#statsBox")) $("#statsBox").innerHTML = `<div class="err">${esc(e.message)}</div>`; }

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error("TIMEOUT: quá " + ms / 1000 + " giây")), ms))]);
const presetText = rows => groupsText(rows.reduce((groups, r) => {
  let g = groups.find(x => x.cat === r.cat); if (!g) groups.push(g = { cat: r.cat, lines: [] });
  r.items.forEach(i => g.lines.push(`${i.size ? `${r.name} (${i.size})` : r.name} - ${money(i.price)}`));
  return groups;

// Ô giá: số < 1000 hiểu là nghìn đồng (25 -> 25K); chữ "25k", "25.000đ" cũng được; không phải giá -> 0
const cellPrice = v => {
  if (typeof v === "number") return Math.round(v < 1000 ? v * 1000 : v);
  const s = String(v ?? "").trim();
  return /^\d[\d.,]*\s*(k|đ|d|₫|vnđ|vnd)?$/i.test(s) ? (parseMenuLine("x " + s)[0]?.price || 0) : 0;
};
// Tiêu đề cột có thể nằm ở BẤT KỲ hàng nào (file nhiều bảng: mỗi mục một bảng có hàng tiêu đề riêng). Hàng tiêu đề có "Tên món" cùng "Giá"/"Size"/cột size (S, M, L, XL, 2XL…);
// "Mục/Nhóm" tuỳ chọn. Dòng chỉ có một ô chữ = tên mục (áp cho các món sau nó). Hàng trước tiêu đề đầu tiên (tên file, số Zalo…) bỏ qua.
function excelToMenuText(rows) {
  const SIZE_RE = /^(xs|s|m|l|xl|xxl|\dxl)$/, out = [];
  let cols = null, cat = "", catOut = null;
  rows.forEach(raw => {
    const r = raw.map(c => typeof c === "string" ? c.trim() : c), cells = r.filter(c => c !== "" && c != null);
    if (!cells.length) return;
    const head = r.map(c => fold(c));
    const find = re => head.findIndex(h => re.test(h));
    const iName = find(/^(ten|ten mon|mon|name|item)$/);
    const sizeCols = head.map((h, i) => SIZE_RE.test(h) ? i : -1).filter(i => i >= 0);
    const priceCols = head.map((h, i) => /^(gia|price|don gia)\b/.test(h) ? i : -1).filter(i => i >= 0);
    if (iName >= 0 && (sizeCols.length || priceCols.length)) {   // hàng tiêu đề mới
      cols = { name: iName, cat: find(/^(muc|nhom|loai|danh muc|category)$/), size: find(/^(size|co|kich co)$/), sizeCols, priceCols, labels: head.map(h => h.toUpperCase()) };
      return;
    }
    if (cells.length === 1 && typeof cells[0] === "string") { if (cols || !/[:|]/.test(cells[0])) cat = cleanHeading(cells[0]); return; }   // tên mục (không phải dòng ghi chú có ":" "|")
    if (!cols) return;
    if (cols.cat >= 0 && String(r[cols.cat] ?? "") !== "") cat = cleanHeading(String(r[cols.cat]));
    const name = cleanName(String(r[cols.name] ?? ""));
    if (!name) return;
    const prices = cols.sizeCols.length ? cols.sizeCols.map(i => [cols.labels[i], cellPrice(r[i])])
      : cols.priceCols.map(i => [cols.size >= 0 ? String(r[cols.size] ?? "").trim() : "", cellPrice(r[i])]);
    prices.filter(p => p[1] > 0).forEach(([size, p]) => {
      if (cat !== catOut) { out.push("# " + cat); catOut = cat; }
      out.push(`${name}${size ? ` (${size})` : ""} - ${money(p)}`);
    });
  });
  return out.join("\n");
}

  }
  return "";
}

async function decodeQr(file) {
  await loadJsQR();
  const bmp = await createImageBitmap(file);
  for (const max of [1600, 800]) {
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const cx = cv.getContext("2d", { willReadFrequently: true }); cx.drawImage(bmp, 0, 0, w, h);
    const r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "attemptBoth" });
    if (r) return r.data;
  }
  throw new Error("Không tìm thấy mã QR trong ảnh");
}
// Chuỗi VietQR (EMVCo) dạng TLV: 2 ký tự tag + 2 ký tự độ dài + giá trị
function parseTlv(str) {
  const o = {}; let i = 0;
  while (i + 4 <= str.length) {
    const len = Number(str.slice(i + 2, i + 4));
    if (!(len >= 0) || i + 4 + len > str.length) break;
    o[str.slice(i, i + 2)] = str.slice(i + 4, i + 4 + len); i += 4 + len;
  }
  return o;
}
function parseQrPayment(text) {
  const t = String(text).trim();
  const momo = t.match(/^2\|99\|(\d{9,11})/) || t.match(/nhantien\.momo\.vn\/(\d{9,11})/);
  if (momo) return { bank: "MOMO", account: normPhone(momo[1]) || momo[1] };
  const mai = parseTlv(t)["38"], acc = mai && parseTlv(mai)["01"] && parseTlv(parseTlv(mai)["01"]);
  if (acc && acc["00"] && acc["01"]) return { bank: (BANKS.find(x => x[2] === acc["00"]) || [""])[0], account: acc["01"] };
  throw new Error("Không phải mã VietQR / MoMo – hãy nhập tay");
}
/* --- Tự sinh mã VietQR chuyển khoản (không phụ thuộc img.vietqr.io) --- */
const tlv = (tag, val) => tag + String(val.length).padStart(2, "0") + val;
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let k = 0; k < 8; k++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, "0");
}
// Chuỗi VietQR động (có số tiền) chuyển nhanh 24/7 tới số tài khoản; "" nếu không có BIN ngân hàng
function buildVietQr(bank, account, amount, info) {
  const bin = (BANKS.find(x => x[0] === bank) || [])[2];
  if (!bin) return "";
  const note = unaccent(info).replace(/[^A-Za-z0-9 ]/g, "").trim().slice(0, 25);
  const body = tlv("00", "01") + tlv("01", "12")
    + tlv("38", tlv("00", "A000000727") + tlv("01", tlv("00", bin) + tlv("01", account)) + tlv("02", "QRIBFTTA"))
    + tlv("53", "704") + (amount > 0 ? tlv("54", String(Math.round(amount))) : "") + tlv("58", "VN")
    + (note ? tlv("62", tlv("08", note)) : "") + "6304";
  return body + crc16(body);
}

      + (apps.length > N ? `<button class="more">Xem thêm ${apps.length - N} app</button>` : "");
    box.querySelector(".more")?.addEventListener("click", e => { box.querySelector(".grid").insertAdjacentHTML("beforeend", apps.slice(N).map(link).join("")); e.target.remove(); });
    box.addEventListener("click", e => { const a = e.target.closest("a[data-app]"); if (a) mem.set("bankApp", a.dataset.app); });
  });
}

// 3 bước: ① Menu (nếu có gì để chọn) → ② Đặt đơn → ③ Nhận tiền + Tạo phiên. Dữ liệu các bước giữ trong `cr` (DOM vẽ lại mỗi bước)
async function viewCreate() {
  const kind = state.newKind === "nuoc" ? "nuoc" : "com", KL = TYPE_INFO[kind].label;
  $("#title").textContent = `Tạo phiên đặt ${KL}`;
  let prev = [], presets = [];
  await Promise.all([
    api("listSessions", { history: true }).then(r => prev = r).catch(() => {}),
    loadPresets().then(r => presets = r.filter(p => p.type === kind)).catch(() => {})
  ]);
  const last = mem.get("bank", null) || prev.filter(s => s.owner_phone === state.user.phone && s.bank && s.account)
    .map(s => ({ bank: s.bank, account: s.account, acc_name: s.acc_name }))[0] || {};
  // Bước Menu chỉ có khi đã có quán cùng loại trong menu có sẵn (phiên cơm chỉ thấy quán cơm, phiên nước chỉ thấy quán nước)
  const steps = [...(presets.length ? [["menu", "Menu"]] : []), ["order", "Đặt đơn"], ["pay", "Nhận tiền"]];
  const cr = {
    step: 0, max: 0, copy: "", place: DEFAULT_PLACE, deadline: mem.get("deadline", ""), subsidy: mem.get("subsidy_" + kind, ""),
    bank: last.bank ? bankLabel(last.bank) : "", account: last.bank === "MOMO" && /^[1-9]\d{8}$/.test(last.account) ? "0" + last.account : last.account || "", accName: last.acc_name || "", prepay: mem.get("prepay", false),
    qrOk: !!(last.bank && last.account)   // đã có thông tin từ mã QR lần trước
  };
  const R = '<span class="req">*</span>';
  // Đọc các ô của bước đang hiện vào cr (trước khi vẽ lại)
  const sync = () => {
    const v = id => $("#" + id)?.value;
    if ($("#copy")) cr.copy = v("copy");
    if ($("#place")) { cr.place = v("place"); cr.deadline = v("deadline"); cr.subsidy = v("subsidy"); }
    if ($("#bank")) { cr.bank = v("bank"); cr.account = v("account"); cr.accName = v("accName"); cr.prepay = $("#prepay").checked; }
  };
  const check = key => {
    if (key === "order" && cr.deadline.trim() && !normTime(cr.deadline)) return "Giờ chốt theo 24 giờ, từ 00:00 đến 23:59 (VD 10:30)";
    if (key === "pay") {
      const bank = bankFromInput(cr.bank), account = cr.account.replace(/[\s.\-]/g, "");
      if (!bank) return "Chọn ngân hàng trong danh sách gợi ý";
      if (!/^\d{6,19}$/.test(account)) return "Số tài khoản chỉ gồm 6–19 chữ số";
      if (bank === "MOMO" && !normPhone(account)) return "Ví MoMo: nhập số điện thoại 10 số";
      if (!cr.accName.trim()) return "Nhập tên chủ tài khoản";
    }
    return "";
  };
  const submit = async () => {
    const err = m => $("#err").textContent = m;
    const bank = bankFromInput(cr.bank), account = cr.account.replace(/[\s.\-]/g, ""), acc_name = cr.accName.trim();
    $("#ok").disabled = true;
    try {
      const preset = cr.copy.startsWith("p:") ? presets.find(p => p.id === cr.copy.slice(2)) : null;
      const r = await api("createSession", {
        place: cr.place.trim() || DEFAULT_PLACE, bank, account, acc_name, copyFrom: cr.copy.startsWith("s:") ? cr.copy.slice(2) : "", prepay: cr.prepay,
        deadline: timeToIso(cr.deadline), subsidy: Math.round(Number(cr.subsidy) * 1000) || 0, kind
      });
      if (preset) {   // menu có sẵn: nạp vào phiên vừa tạo (cùng cách lưu menu ở tab Thêm menu)
        try {
          const note = { com: [], nuoc: [], shops: { com: "", nuoc: "" } }; note.shops[kind] = preset.shop.slice(0, 60);
          await api("saveMenu", { id: r.id, items: parseMenu(preset.text, kind), note: JSON.stringify(note), shop: preset.shop.slice(0, 60) });
        } catch { toast("Đã tạo phiên nhưng chưa nạp được menu – vào tab Thêm menu để chọn lại"); }
      }
      mem.set("bank", { bank, account, acc_name });
      mem.set("deadline", normTime(cr.deadline));
      mem.set("subsidy_" + kind, cr.subsidy);
      mem.set("prepay", cr.prepay);
      state.panel = "menu"; state.mtab = kind; go("session", r.id);
    } catch (e) { err(e.message); $("#ok").disabled = false; }
  };
  const draw = () => {
    const key = steps[cr.step][0], lastStep = cr.step === steps.length - 1;
    const stepBar = stepsHtml(steps.map(s => s[1]), cr.step, i => i <= cr.max);
    const body = {
      menu: () => `<label for="copy">Quán ${KL} có sẵn</label><select id="copy"><option value="">Không – tạo menu mới</option>
        <optgroup label="Quán ${KL} có sẵn">${presets.map(p => `<option value="p:${esc(p.id)}" ${cr.copy === "p:" + p.id ? "selected" : ""}>${esc(p.shop)}</option>`).join("")}</optgroup></select>
        <div class="mute mt2">Chọn quán là menu được nạp vào phiên ngay. Chưa có quán cần đặt thì chọn "Không", tạo phiên rồi thêm món ở tab Menu (tick "Lưu quán này vào menu có sẵn" để lần sau chọn được).</div>`,
      order: () => `<label>Địa điểm lấy ${KL} ${R}</label>
        <input id="place" value="${esc(cr.place)}">
        <label>Giờ chốt đơn</label>
        <input type="text" id="deadline" data-time inputmode="numeric" maxlength="5" placeholder="HH:MM (00:00 – 23:59), VD: 10:30" value="${esc(cr.deadline)}">
        <div class="mute">Hiện đếm ngược cho mọi người. Tới giờ bạn vẫn tự bấm "Chốt đơn".</div>
        <label>Deeyu hỗ trợ mỗi ${unitWord({ kind })} (nghìn đồng)</label>
        <input type="number" id="subsidy" inputmode="numeric" min="0" placeholder="VD: 20 – để trống nếu không hỗ trợ" value="${esc(cr.subsidy)}">
        <div class="mute">Trừ thẳng vào tiền mỗi người phải trả. ${kind === "nuoc" ? "Tính theo từng ly nước." : "Không tính nước và cơm thêm."}</div>`,
      pay: () => `<label>Nhập nhanh bằng ảnh mã QR nhận tiền (VietQR hoặc MoMo) – không bắt buộc</label>
        <input type="file" id="qrImg" accept="image/*">
        <div class="mute" id="qrStatus" style="margin:4px 0 8px">${cr.qrOk ? "Đang dùng thông tin lần trước. Sửa trực tiếp bên dưới hoặc chọn ảnh QR khác." : "Chọn ảnh QR để app tự điền ngân hàng + số tài khoản, hoặc tự nhập bên dưới."}</div>
        <label>Ngân hàng / MoMo ${R}</label>
        <input id="bank" list="bankList" autocomplete="off" placeholder="Chọn / gõ tên ngân hàng, hoặc nhập nhanh bằng ảnh QR" value="${esc(cr.bank)}">
        <datalist id="bankList">${BANKS.map(b => `<option value="${esc(b[0] + " - " + b[1])}">`).join("")}</datalist>
        <label>Số tài khoản ${R}</label>
        <input id="account" inputmode="numeric" placeholder="VD: 0123456789 (MoMo: số điện thoại)" value="${esc(cr.account)}">
        <label>Tên chủ tài khoản ${R}</label>
        <input id="accName" placeholder="VD: NGUYEN VAN A" value="${esc(cr.accName)}">
        <label class="chk mt3"><input type="checkbox" id="prepay" ${cr.prepay ? "checked" : ""}> Yêu cầu chuyển khoản trước để đặt</label>
        <div class="mute">Bật: đơn của người đặt chỉ được tính vào tin nhắn tổng hợp sau khi bạn đánh dấu "Đã trả".</div>`
    }[key]();
    $("#app").innerHTML = stepBar + `<div class="card"><h2>${steps[cr.step][1]}</h2>${body}<div class="err" id="err" role="alert"></div>
      <div class="row mt2">${cr.step ? `<button class="ghost plain" id="back">${I("back", "sm")} Quay lại</button>` : ""}<button class="primary grow" id="${lastStep ? "ok" : "next"}" style="margin:0">${lastStep ? `${I("check", "sm")} Tạo phiên` : `Tiếp ${I("right", "sm")}`}</button></div></div>`;
    document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { sync(); cr.step = +b.dataset.step; draw(); });
    if ($("#back")) $("#back").onclick = () => { sync(); cr.step--; draw(); };
    if ($("#next")) $("#next").onclick = () => {
      sync();
      const m = check(key); if (m) return $("#err").textContent = m;
      cr.step++; cr.max = Math.max(cr.max, cr.step); draw();
    };
    if ($("#ok")) $("#ok").onclick = () => {
      sync();
      const m = steps.map(([k]) => check(k)).find(Boolean); if (m) return $("#err").textContent = m;
      submit();
    };
    if ($("#qrImg")) $("#qrImg").onchange = async e => {
      const f = e.target.files[0], st = m => $("#qrStatus").textContent = m;
      if (!f) return;
      try {
        st("Đang đọc mã QR…");
        const r = parseQrPayment(await decodeQr(f));
        $("#bank").value = r.bank ? bankLabel(r.bank) : "";
        $("#account").value = r.account;
        st(`Đã đọc QR: ${r.bank ? bankLabel(r.bank) : "(ngân hàng chưa nhận ra – hãy chọn ở ô Ngân hàng)"} · ${r.account}. Nhập tên chủ tài khoản rồi tạo phiên.`);
      } catch (err) { st("Lỗi: " + err.message); }
      e.target.value = "";
    };
  };
  draw();
}

/* ===== PHIÊN ===== */
async function viewSession(keepCart = false) {
  $("#app").innerHTML = state.data ? $("#app").innerHTML : `<div class="card skel" style="background:none;box-shadow:none;padding:4px 2px"><i style="height:24px"></i><i></i><i></i></div>${skel(3)}`;
  try {
    const d = await api("getSession", { id: state.sid });
    if (!keepCart) {
      state.cart = d.orders.filter(o => o.phone === state.user.phone)
        .map(o => ({ name: o.item, size: o.size || "", toppings: o.toppings ? o.toppings.split("|") : [], qty: o.qty, note: o.note }));
    }
    state.data = d;
    drawSession();
    clearInterval(state.timer);
    state.timer = setInterval(() => {
      if (state.view === "session" && !state.busy && !state.dirty && !state.cartDirty && !document.activeElement?.matches("input,textarea")) refreshSession();
    }, 15000);
  } catch (e) { $("#app").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
// Gửi kèm phiên bản dữ liệu đang có: không ai đổi gì thì server trả { same: true }, không phải vẽ lại
async function refreshSession() {
  try {
    const d = await api("getSession", { id: state.sid, v: state.data?.v });
    if (d.same) return;
    state.data = d; drawSession();
  } catch {}
}

const isOwner = () => state.data.session.owner_phone === state.user.phone;
// Gửi link phiên vào nhóm chat: bảng chia sẻ của điện thoại, máy không hỗ trợ thì copy link
async function shareSession() {
  const s = state.data.session, url = location.href.split("#")[0] + "#s=" + state.sid;
  const text = `Vào đặt ${recvWord(s)} cùng mình${s.shop ? ": " + s.shop : ""}${s.deadline ? ` (chốt ${isoToTime(s.deadline)})` : ""}`;
  if (navigator.share) { try { await navigator.share({ title: "Deeyu Food", text, url }); return; } catch (e) { if (e.name === "AbortError") return; } }
  copyText(text + "\n" + url);
}
const isOpen = () => state.data.session.status === "open";

function drawSession() {
  const { session: s } = state.data;
  state.dirty = false;
  $("#title").textContent = s.kind === "nuoc" ? "Phiên đặt nước" : "Phiên đặt cơm";
  const owner = isOwner();
  const soon = isOpen() && s.deadline && new Date(s.deadline) - Date.now() < 30 * 60e3;
  $("#app").innerHTML = `
    <div class="sesshead">
      <div class="row"><div class="shopname grow" style="margin:0">${esc(s.shop || (s.kind === "nuoc" ? "Phiên đặt nước" : "Phiên đặt cơm"))}</div>
        <span class="tag ${isOpen() ? "ok" : "gray"}">${isOpen() ? "Đang mở" : "Đã chốt"}</span></div>
      <div class="row mt1">
        <div class="by grow">${avatar(s.owner_name, s.owner_phone)}<span>${owner ? "Bạn mở phiên" : esc(s.owner_name)} · ${esc(s.owner_phone)}</span></div>
        <button class="iconbtn" id="shareBtn" title="Gửi link phiên cho mọi người" aria-label="Chia sẻ phiên">${I("share")}</button>
      </div>
      <div class="infochips">
        <span class="ichip ${soon ? "warn" : ""}" id="hdl">${dlSpan(s)}</span>
        ${s.subsidy ? `<span class="ichip gift">${I("gift", "sm")} Hỗ trợ ${money(s.subsidy)}/${unitWord(s).split(" ")[0]}</span>` : ""}
        <span class="ichip">${I("pin", "sm")} ${esc(s.place)}</span>
      </div>
    </div>
    <div class="tabs five" id="mainTabs"></div>
    <div id="panel"></div>`;
  $("#shareBtn").onclick = shareSession;
  // Các bước của phiên: Đặt · Menu · Cài đặt (gồm Xóa phiên) · Chốt & thu (3 tab sau chỉ người tạo phiên thấy)
  const old = { com: "order", nuoc: "order", orders: "close", manage: "menu", delete: "settings" };
  if (old[state.panel]) { if (old[state.panel] === "order") state.tab = state.panel; state.panel = old[state.panel]; }
  if (!owner || !["order", "menu", "settings", "close"].includes(state.panel)) state.panel = "order";
  if (s.kind) state.tab = s.kind; else if (state.tab !== "com" && state.tab !== "nuoc") state.tab = "com";
  paintTabs();
  if (state.panel === "order") drawOrder(); else drawManage();
}
function paintTabs() {
  const box = $("#mainTabs"); if (!box) return;
  const s = state.data.session, n = state.cart.reduce((q, l) => q + l.qty, 0);
  const tab = (p, icon, text) => `<button data-p="${p}" class="${state.panel === p ? "on" : ""}" ${state.panel === p ? 'aria-current="page"' : ""}>${I(icon)}<span>${text}</span></button>`;
  const order = s.kind === "nuoc" ? ["cup", "Đặt nước"] : s.kind === "com" ? ["rice", "Đặt cơm"] : ["bag", "Đặt món"];
  // Người chọn món chỉ có một bước -> không cần tab (nút Đặt nằm ở thanh dưới)
  box.className = isOwner() ? "tabs five" : "hidden";
  if (!isOwner()) { box.innerHTML = ""; return; }
  box.innerHTML = tab("order", order[0], order[1] + (n ? ` (${n})` : ""))
    + tab("menu", "file", "Menu") + tab("settings", "sliders", "Cài đặt") + tab("close", "list", "Chốt & thu");
  box.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    if (b.dataset.p === "menu" && !s.kind) state.mtab = state.tab;
    state.panel = b.dataset.p; state.q = ""; drawSession();
  });
}

/* --- Đặt món --- */
// Giỏ = danh sách dòng { name, size, toppings: [...], qty, note }; mỗi tổ hợp (món, size, topping) là một dòng
const lineKey = l => JSON.stringify([l.name, l.size || "", l.toppings]);
// Nút −/+ số lượng (data-ld được bắt chung ở document)
const qtyHtml = (q, open) => `<div class="qty"><button data-ld="-1" ${open ? "" : "disabled"} aria-label="Bớt một">${I("minus", "sm")}</button><span aria-live="polite">${q}</span><button data-ld="1" ${open ? "" : "disabled"} aria-label="Thêm một">${I("plus", "sm")}</button></div>`;
const findVariant = (name, size) => state.data.menu.find(m => !isTopping(m) && m.name === name && (m.size || "") === (size || ""));
const lineUnit = l => { const v = findVariant(l.name, l.size); return v ? v.price + l.toppings.reduce((t, n) => t + (state.data.menu.find(m => isTopping(m) && m.name === n)?.price || 0), 0) : 0; };
function cartTotal() { return state.cart.reduce((t, l) => t + lineUnit(l) * l.qty, 0); }
// Deeyu hỗ trợ: phiên cơm = mỗi suất cơm (không tính nước, cơm thêm); phiên nước = mỗi ly nước. Được trừ s.subsidy, không quá tiền món
const isPortion = (s, type, item) => s.kind === "nuoc" ? type === "nuoc" : type === "com" && !EXTRA_RICE_RE.test(item);
const unitWord = s => s.kind === "nuoc" ? "ly nước" : "suất cơm";
const recvWord = s => s.kind === "nuoc" ? "nước" : s.kind === "com" ? "cơm" : "cơm / nước";
// Phiên cũ (kind trống) có cả cơm và nước; phiên mới chỉ một loại
const kindTypes = s => s.kind ? [s.kind] : ["com", "nuoc"];
const subsidyOf = (s, amount, portions) => Math.min(amount, (s.subsidy || 0) * portions);
const cartSubsidy = () => subsidyOf(state.data.session, cartTotal(),
  state.cart.reduce((n, l) => n + (isPortion(state.data.session, findVariant(l.name, l.size)?.type, l.name) ? l.qty : 0), 0));
// Ghi chú theo loại { com: [...], nuoc: [...] } lưu dạng JSON trong session.note
function parseNotes(raw) {
  let o; try { o = JSON.parse(raw); } catch {}
  return { com: Array.isArray(o?.com) ? o.com : [], nuoc: Array.isArray(o?.nuoc) ? o.nuoc : [],
           shops: { com: String(o?.shops?.com || ""), nuoc: String(o?.shops?.nuoc || "") } };
}
const shopName = type => parseNotes(state.data.session.note).shops[type];
const shopHead = type => shopName(type) && !state.data.session.kind ? `<div class="shopname">${esc(shopName(type))}</div>` : "";
const notesCard = type => {
  const l = parseNotes(state.data.session.note)[type];
  return l.length ? `<div class="callout">${I("info", "sm")}<div><b>Lưu ý món ${TYPE_INFO[type].label}</b><br>${l.map(esc).join("<br>")}</div></div>` : "";
};
function drawOrder() {
  const { menu } = state.data, type = state.tab, open = isOpen();
  const items = drinkOptions(type), tops = toppingsOf(type);
  const lineHtml = l => `
    <div class="line" data-k="${esc(lineKey(l))}"><div class="row"><div class="grow mute">${esc([l.size, ...l.toppings.map(t => "+ " + t)].filter(Boolean).join(" · ") || "Trong giỏ")} · <b style="color:var(--ink)">${money(lineUnit(l) * l.qty)}</b></div>
      ${qtyHtml(l.qty, open)}</div>
      <input class="note" placeholder="Ghi chú riêng của bạn (ít đá, ít ngọt, ít cơm…)" maxlength="200" value="${esc(l.note)}" ${open ? "" : "disabled"}></div>`;
  // Combo "2 món 27K": ô tick là các món chọn kèm (giá 0) và phải chọn đúng số món ghi trong tên
  const pickOf = it => { const m = tops.length && tops.every(t => !t.price) && COMBO_RE.exec(it.name); return m ? parseInt(m[0]) : 0; };
  const topsLabel = (pick, n) => pick ? `Chọn món (${n}/${pick})` : n ? `Topping (${n})` : "Chọn topping";
  const itemHtml = it => {
    const sel = state.sel[it.name] ||= { size: it.variants[0].size, tops: [] }, pick = pickOf(it);
    if (!it.variants.some(v => v.size === sel.size)) sel.size = it.variants[0].size;
    sel.tops = sel.tops.filter(n => tops.some(t => t.name === n));
    const multi = it.variants.length > 1;
    // Nhiều size: mỗi size một nút bấm (thay cho ô chọn), giá ghi ngay trên nút
    return `
      <div class="item ${state.cart.some(l => l.name === it.name) ? "in" : ""}" data-n="${esc(it.name)}" data-f="${esc(fold(it.name))}" data-pick="${pick}">
        <div class="row"><div class="grow"><div class="n">${esc(it.name)}</div>${multi ? "" : `<div class="p">${money(it.variants[0].price)}</div>`}</div>
          <button class="add" data-add ${open ? "" : "disabled"} title="Thêm vào giỏ" aria-label="Thêm ${esc(it.name)} vào giỏ">${I("plus")}</button></div>
        ${multi ? `<div class="chips">${it.variants.map(v => `<button class="chip ${v.size === sel.size ? "on" : ""}" data-size="${esc(v.size)}">${v.size ? esc(v.size) : "Mặc định"} · ${money(v.price)}</button>`).join("")}</div>` : ""}
        ${tops.length ? `<details class="dd" style="margin-top:8px" data-dd="${esc(it.name)}" ${state.ddOpen.has(it.name) ? "open" : ""}><summary>${topsLabel(pick, sel.tops.length)}</summary><div class="ddbox">${tops.map(t => `<label class="chk"><input type="checkbox" data-top="${esc(t.name)}" ${sel.tops.includes(t.name) ? "checked" : ""} ${pick && sel.tops.length >= pick && !sel.tops.includes(t.name) ? "disabled" : ""}> ${esc(t.name)} ${t.price ? `<span class="mute">+${money(t.price)}</span>` : ""}</label>`).join("")}</div></details>` : ""}
        ${state.cart.filter(l => l.name === it.name).map(lineHtml).join("")}
      </div>`;
  };
  const groups = groupByCat(items), cats = groups.map((g, i) => g.cat ? `<button class="chip" data-jump="${i}">${esc(g.cat)}</button>` : "").join("");
  // Menu dài: ô tìm món + nút nhảy tới từng mục, dính ở đầu màn hình khi cuộn
  const finder = items.length > 8 ? `<div class="finder">
      <div class="search">${I("search")}<input id="q" type="search" aria-label="Tìm món" placeholder="Tìm món (gõ không dấu cũng được)" value="${esc(state.q)}"></div>
      ${groups.filter(g => g.cat).length > 1 ? `<div class="chips">${cats}</div>` : ""}</div>` : "";
  $("#panel").innerHTML = `
    ${state.data.session.kind ? "" : `<div class="tabs sm"><button data-t="com" class="${type === "com" ? "on" : ""}">${I("rice", "sm")} Cơm</button><button data-t="nuoc" class="${type === "nuoc" ? "on" : ""}">${I("cup", "sm")} Nước</button></div>`}
    ${shopHead(type)}
    ${notesCard(type)}
    ${finder}
    <div class="card" id="menuCard">${!menu.length ? `<div class="empty">${I("file")}Người mở phiên chưa nhập menu.${isOwner() ? `<br>Vào tab <b>Menu</b> để thêm món.` : "<br>Quay lại sau ít phút nhé."}</div>` :
      items.length ? groups.map((g, i) => (g.cat ? `<div class="cat" data-ci="${i}">${esc(g.cat)}</div>` : "") + g.items.map(itemHtml).join("")).join("") + `<div class="empty hidden" id="noHit">${I("search")}Không có món nào khớp.</div>` : `<div class="empty">Không có món trong mục này.</div>`}</div>
    <div class="card" id="peopleCard"></div>`;
  paintPeople();
  applyFilter();
  const selOf = el => state.sel[el.closest(".item").dataset.n];
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { state.tab = b.dataset.t; state.q = ""; drawOrder(); });
  if ($("#q")) $("#q").oninput = e => { state.q = e.target.value; applyFilter(); };
  document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => {
    if (state.q) { state.q = $("#q").value = ""; applyFilter(); }
    $(`.cat[data-ci="${b.dataset.jump}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  document.querySelectorAll(".chip[data-size]").forEach(b => b.onclick = () => {
    selOf(b).size = b.dataset.size;
    b.parentElement.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
  });
  document.querySelectorAll("input[data-top]").forEach(e => e.onchange = () => {
    const box = e.closest(".item"), sel = selOf(e);
    sel.tops = [...box.querySelectorAll("input[data-top]:checked")].map(x => x.dataset.top);
    const pick = +box.dataset.pick;
    box.querySelector("summary").textContent = topsLabel(pick, sel.tops.length);
    if (pick) box.querySelectorAll("input[data-top]").forEach(x => x.disabled = sel.tops.length >= pick && !x.checked);
  });
  document.querySelectorAll("details[data-dd]").forEach(d => d.ontoggle = () => d.open ? state.ddOpen.add(d.dataset.dd) : state.ddOpen.delete(d.dataset.dd));
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    const n = b.closest(".item").dataset.n, sel = state.sel[n], pick = +b.closest(".item").dataset.pick;
    if (pick && sel.tops.length !== pick) { state.ddOpen.add(n); drawOrder(); return toast(`Chọn đủ ${pick} món trong combo`); }
    const l = { name: n, size: sel.size, toppings: tops.map(t => t.name).filter(x => sel.tops.includes(x)), qty: 1, note: "" };
    const ex = state.cart.find(x => lineKey(x) === lineKey(l));
    if (ex) ex.qty = Math.min(50, ex.qty + 1); else state.cart.push(l);
    if (pick) sel.tops = [];   // combo kế tiếp chọn món lại từ đầu
    drawOrder();
    markCart();
  });
  document.querySelectorAll(".line input.note").forEach(i => i.oninput = () => { state.cart.find(x => lineKey(x) === i.closest(".line").dataset.k).note = i.value; markCart(); });
  paintBar();
}
// Lọc món theo ô tìm: ẩn món không khớp, ẩn tiêu đề mục không còn món nào
function applyFilter() {
  if (!$("#menuCard")) return;
  const q = fold(state.q.trim());
  document.querySelectorAll("#menuCard .item").forEach(el => el.classList.toggle("hidden", !!q && !el.dataset.f.includes(q)));
  document.querySelectorAll("#menuCard .cat").forEach(c => {
    let n = c.nextElementSibling, any = false;
    for (; n && n.classList.contains("item"); n = n.nextElementSibling) if (!n.classList.contains("hidden")) any = true;
    c.classList.toggle("hidden", !any);
  });
  $("#noHit")?.classList.toggle("hidden", !q || !!$("#menuCard .item:not(.hidden)"));
}

// Lưu ảnh mã QR vào máy để app ngân hàng / MoMo quét từ ảnh: điện thoại dùng bảng chia sẻ (có "Lưu ảnh"), không được thì tải file
async function saveQr(img) {
  if (!img?.src) return toast("Mã QR chưa tải xong");
  try {
    const blob = await (await fetch(img.src)).blob();
    const file = new File([blob], "deeyu-qr.png", { type: blob.type || "image/png" });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) { if (e.name !== "AbortError") throw e; }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast("Đã lưu ảnh QR ✓");
  } catch { toast("Không lưu được – hãy nhấn giữ vào mã QR để lưu ảnh, hoặc chụp màn hình"); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-ld]");
  if (!b || b.disabled || state.view !== "session") return;
  const l = state.cart.find(x => lineKey(x) === b.closest("[data-k]").dataset.k);
  if (!l) return;
  l.qty = Math.max(0, Math.min(50, l.qty + Number(b.dataset.ld)));

  drawOrder();
  markCart();
});

// Khối "Mọi người đã đặt": công khai cho mọi người, xem theo người hoặc theo món. Bạn luôn ở đầu; giỏ chưa bấm Đặt hiện là "chưa đặt"
const lineLabel = l => orderLabel({ item: l.name, size: l.size, toppings: l.toppings.join("|") });
function paintPeople() {
  const box = $("#peopleCard"); if (!box) return;
  const s = state.data.session, me = state.user.phone, view = state.peopleView ||= "person", by = new Map();
  state.data.orders.forEach(o => {
    if (!by.has(o.phone)) by.set(o.phone, { phone: o.phone, name: o.name, paid: o.paid, claimed: o.claimed, rows: [] });
    by.get(o.phone).rows.push({ label: orderLabel(o), qty: o.qty, note: o.note });
  });
  if (state.cartDirty) {   // đơn đang sửa của tôi thay cho đơn đã lưu
    by.delete(me);
    if (state.cart.length) by.set(me, { phone: me, name: state.user.name, pending: true, rows: state.cart.map(l => ({ label: lineLabel(l), qty: l.qty, note: l.note })) });
  }
  const people = [...by.values()].sort((a, b) => (b.phone === me) - (a.phone === me) || a.name.localeCompare(b.name, "vi"));
  const nameOf = p => p.phone === me ? "Bạn" : p.name, portions = people.reduce((n, p) => n + p.rows.reduce((q, r) => q + r.qty, 0), 0);
  const tag = p => p.pending ? `<span class="tag">Chưa bấm đặt</span>` : p.paid ? `<span class="tag ok">Đã trả</span>` : p.claimed ? `<span class="tag info">Báo đã chuyển</span>` : s.prepay ? `<span class="tag locked">Chờ chuyển khoản</span>` : "";
  let body;
  if (!people.length) body = `<div class="empty">${I("users")}Chưa có ai đặt – bạn là người đầu tiên!</div>`;
  else if (view === "person") body = people.map(p => `<div class="item person">${avatar(p.name, p.phone)}<div class="grow"><div class="row"><b class="grow">${esc(nameOf(p))}</b>${tag(p)}</div>
      <div class="mute">${p.rows.map(r => `${r.qty}× ${esc(r.label)}${r.note ? " (" + esc(r.note) + ")" : ""}`).join(", ")}</div></div></div>`).join("");
  else {
    const agg = new Map();
    people.forEach(p => p.rows.forEach(r => {
      const a = agg.get(r.label) || agg.set(r.label, { qty: 0, who: [] }).get(r.label);
      a.qty += r.qty; a.who.push(`${nameOf(p)}${r.qty > 1 ? " ×" + r.qty : ""}${r.note ? " (" + r.note + ")" : ""}`);
    }));
    body = [...agg].map(([label, a]) => `<div class="item"><div class="row"><div class="grow"><b>${esc(label)}</b></div><b>×${a.qty}</b></div><div class="mute">${a.who.map(esc).join(", ")}</div></div>`).join("");
  }
  box.innerHTML = `<div class="row" style="margin-bottom:8px"><h2 class="grow" style="margin:0">Mọi người đã đặt</h2><span class="mute">${people.length} người · ${portions} phần</span></div>
    <div class="tabs sm"><button data-pv="person" class="${view === "person" ? "on" : ""}">Theo người</button><button data-pv="item" class="${view === "item" ? "on" : ""}">Theo món</button></div>${body}`;
  box.querySelectorAll("[data-pv]").forEach(b => b.onclick = () => { state.peopleView = b.dataset.pv; paintPeople(); });
}
function paintBar() {
  const s = state.data.session, sub = cartSubsidy(), total = cartTotal() - sub, count = state.cart.reduce((t, l) => t + l.qty, 0);
  const mine = state.data.orders.filter(o => o.phone === state.user.phone);
  const paid = mine.length > 0 && mine.every(o => o.paid), claimed = mine.length > 0 && mine.every(o => o.claimed);
  const canPay = total > 0 && s.bank && s.account, open = isOpen();
  const word = s.kind === "nuoc" ? "Đặt nước" : s.kind === "com" ? "Đặt cơm" : "Đặt món";
  const dirty = state.cartDirty && (count || mine.length);
  const hint = saver.msg || (dirty ? "Chưa lưu đơn" : !count ? (open ? "Bấm + để chọn món" : "") : paid ? "✓ Người đặt đã xác nhận chuyển khoản" : claimed ? "Đã báo chuyển – chờ người đặt xác nhận"
    : s.prepay ? "Cần chuyển khoản trước – đơn chỉ được tính sau khi người đặt xác nhận" : mine.length ? "✓ Đã đặt" : "");
  const hintCls = /^⚠/.test(saver.msg) ? "bad" : !dirty && (paid || /^✓/.test(hint)) ? "ok" : "";
  // Một hàng: giỏ (số món + tổng tiền) · nút chuyển khoản · nút Đặt. Có cả hai nút thì nút chuyển khoản thu gọn thành icon
  const placeBtn = !open ? "" : saver.running ? `<button class="primary fit" disabled><span class="spin"></span> Đang đặt…</button>`
    : dirty ? `<button class="primary fit" id="placeBtn">${count ? word : "Cập nhật đơn"}</button>` : "";
  const payBtn = !canPay ? "" : placeBtn ? `<button class="ghost sq" id="payBtn" title="Chuyển khoản" aria-label="Chuyển khoản">${I("qr")}</button>`
    : `<button class="${paid ? "ghost sq" : "primary fit"}" id="payBtn" ${paid ? 'title="Chuyển khoản" aria-label="Chuyển khoản"' : ""}>${I("qr", paid ? "" : "sm")}${paid ? "" : " Chuyển khoản"}</button>`;
  if (!count) state.cartOpen = false;
  paintTabs();
  // Bấm vào tổng tiền để mở / đóng giỏ: xem lại mọi món đã chọn, sửa số lượng ngay tại đây
  const cart = state.cartOpen ? `<div class="cartbox">${state.cart.map(l => `
    <div class="row" data-k="${esc(lineKey(l))}"><div class="grow"><b>${esc(l.name)}</b><br><span class="mute">${esc([l.size, ...l.toppings.map(t => "+ " + t)].filter(Boolean).join(" · "))} ${money(lineUnit(l))}${l.note ? " · " + esc(l.note) : ""}</span></div>
      ${qtyHtml(l.qty, open)}</div>`).join("")}</div>` : "";
  setBar(`${cart}<div class="cartbar"><button class="cartsum" id="cartBtn" ${count ? "" : "disabled"} aria-expanded="${state.cartOpen}">
      <span class="bag">${I("bag")}${count ? `<span class="badge">${count}</span>` : ""}</span>
      <span class="grow"><span class="tot">${money(total)}${sub ? `<small title="Đã trừ Deeyu hỗ trợ ${money(sub)}">${I("gift", "sm")}−${money(sub)}</small>` : ""}</span><span class="hint ${open ? hintCls : ""}">${esc(open ? hint : "Phiên đã chốt – không đặt thêm được.")}</span></span>
      ${count ? I(state.cartOpen ? "down" : "up", "sm") : ""}</button>${payBtn}${placeBtn}</div>`);
  $("#cartBtn").onclick = () => { state.cartOpen = !state.cartOpen; paintBar(); };
  if ($("#placeBtn")) $("#placeBtn").onclick = placeNow;
  if ($("#payBtn")) $("#payBtn").onclick = showPay;
}

function ordersByPerson(orders, manage) {
  if (!orders.length) return `<span class="mute">Chưa có ai đặt.</span>`;
  const by = {}, s = state.data.session, tot = { amount: 0, sub: 0 };
  orders.forEach(o => (by[o.phone] ||= { name: o.name, paid: o.paid, claimed: o.claimed, rows: [] }).rows.push(o));
  const list = Object.entries(by).map(([ph, p]) => {
    const amount = p.rows.reduce((t, o) => t + o.price * o.qty, 0);
    const sub = subsidyOf(s, amount, p.rows.reduce((n, o) => n + (isPortion(s, o.type, o.item) ? o.qty : 0), 0));
    tot.amount += amount; tot.sub += sub;
    const claim = p.claimed && !p.paid ? `<span class="tag info">Báo đã chuyển</span>` : "";
    return `<div class="item person">${avatar(p.name, ph)}<div class="grow">
      <div class="row"><div class="grow"><b>${esc(p.name)}</b> <span class="mute">${esc(ph)}</span></div>
        <b class="num" title="${sub ? `Tiền món ${money(amount)} − hỗ trợ ${money(sub)}` : ""}">${money(amount - sub)}</b></div>
      <div class="mute">${p.rows.map(o => `${o.qty}× ${esc(orderLabel(o))}${o.note ? " (" + esc(o.note) + ")" : ""}`).join(", ")}${sub ? ` · hỗ trợ −${money(sub)}` : ""}</div>
      ${manage ? `<div class="row mt2">${claim}<span class="grow"></span><button class="ghost ${p.paid ? "paid" : "plain"}" data-paid="${esc(ph)}" data-v="${p.paid ? 0 : 1}">${p.paid ? `${I("check", "sm")} Đã trả` : p.claimed ? `${I("check", "sm")} Xác nhận` : "Đánh dấu đã trả"}</button></div>`
        : p.paid ? `<div class="mt1"><span class="tag ok">Đã trả</span></div>` : claim || s.prepay ? `<div class="mt1">${claim || `<span class="tag locked">Chờ chuyển khoản</span>`}</div>` : ""}</div></div>`;
  }).join("");
  // Người tạo phiên: tổng tiền trả quán / Deeyu hỗ trợ / cần thu từ mọi người
  return list + (manage && tot.sub ? `<div class="mute mt2">Tiền món <b>${money(tot.amount)}</b> · Deeyu hỗ trợ <b>${money(tot.sub)}</b> · Cần thu <b>${money(tot.amount - tot.sub)}</b></div>` : "");
}

// Đơn chỉ được lưu khi bấm nút "Đặt cơm / Đặt nước": sửa giỏ chỉ đánh dấu "chưa đặt"
const saver = { running: false, msg: "" };
function markCart() {
  state.cartDirty = true; saver.msg = "";
  paintPeople();
  paintBar();
}
async function placeNow() {
  if (saver.running) return;
  saver.running = true; saver.msg = ""; paintBar();
  const sid = state.sid;
  try {
    const items = state.cart.filter(l => state.data.menu.some(m => m.active && m.name === l.name && (m.size || "") === l.size))
      .map(l => ({ name: l.name, size: l.size, toppings: l.toppings, qty: l.qty, note: l.note }));
    await api("placeOrder", { id: sid, items });
    if (state.view === "session" && state.sid === sid) {
      state.data = await api("getSession", { id: sid });
      state.cartDirty = false;
      saver.msg = "✓ Đã đặt";
    }
  } catch (e) { saver.msg = "⚠ Chưa đặt được: " + e.message; }
  saver.running = false;
  if (state.view === "session" && state.sid === sid && state.data) { if ($("#peopleCard")) paintPeople(); paintBar(); }
}
window.addEventListener("beforeunload", e => { if (state.cartDirty) { e.preventDefault(); e.returnValue = ""; } });

// Mã QR (VietQR) hoặc link MoMo để chuyển `amount` vào tài khoản nhận tiền của phiên s
function payBoxHtml(s, amount) {
  const info = transferNote();
  // Bảng thông tin nhận tiền, số tài khoản và nội dung có nút copy
  const kv = (l, v, copy) => `<div class="kv"><span>${l}</span><b>${esc(v)}${copy ? ` <button class="iconbtn" style="width:28px;height:28px;display:inline-grid;vertical-align:middle" data-copy="${esc(v)}" aria-label="Copy ${l}">${I("copy", "sm")}</button>` : ""}</b></div>`;
  const rows = kv("Người nhận", s.acc_name) + kv(s.bank === "MOMO" ? "Ví" : "Ngân hàng", bankLabel(s.bank)) + kv(s.bank === "MOMO" ? "Số MoMo" : "Số tài khoản", s.account, true) + kv("Nội dung", info, true);
  if (s.bank === "MOMO") {
    // Link nhantien.momo.vn chỉ mở trang chủ app (không điền sẵn người nhận) -> dùng mã QR cá nhân MoMo
    // "2|99|SĐT|Tên|email|0|0|số tiền": lưu ảnh rồi MoMo → Quét mã → chọn ảnh. Nút mở app thì copy sẵn số MoMo
    const phone = normPhone(s.account) || (/^[1-9]\d{8}$/.test(s.account) ? "0" + s.account : String(s.account));
    const mq = `2|99|${phone}|${unaccent(s.acc_name || "").toUpperCase()}||0|0|${Math.round(amount)}`;
    return `<div class="qrbox"><h2>Chuyển MoMo ${money(amount)}</h2><div class="mute">Chụp màn hình / lưu ảnh mã này, rồi trong MoMo chọn Quét mã → chọn ảnh – số tiền đã điền sẵn</div>
      <img class="qr" src="" data-vq="${esc(mq)}" alt="Mã QR MoMo ${money(amount)}">${MOBILE_OS ? `<button class="ghost plain" data-saveqr>${I("down", "sm")} Lưu ảnh QR</button>` : ""}${rows}
      <a class="btnlink" href="https://nhantien.momo.vn/${encodeURIComponent(phone)}/${Math.round(amount)}" target="_blank" rel="noopener" data-copy="${esc(phone)}">Copy số & mở MoMo</a>
      <div class="mute center">Mở app xong: Chuyển tiền → dán số ${esc(phone)}</div></div>`;
  }
  const url = `https://img.vietqr.io/image/${encodeURIComponent(vqCode(s.bank))}-${encodeURIComponent(s.account)}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(info)}&accountName=${encodeURIComponent(s.acc_name)}`;
  const vq = buildVietQr(s.bank, String(s.account), amount, info);
  // Trên điện thoại: chỗ trống cho danh sách app ngân hàng (paintBankApps điền vào)
  const apps = MOBILE_OS ? `<div class="bankapps" data-ba="${esc(`${s.account}@${vqCode(s.bank).toLowerCase()}`)}" data-am="${Math.round(amount)}" data-tn="${esc(unaccent(info).replace(/[^A-Za-z0-9 ]/g, "").trim().slice(0, 25))}" data-bn="${esc(unaccent(s.acc_name || ""))}"></div>` : "";
  return `<div class="qrbox"><h2>Chuyển khoản ${money(amount)}</h2>${apps}<div class="mute">${MOBILE_OS ? "Hoặc quét" : "Quét"} bằng app ngân hàng – số tiền và nội dung đã điền sẵn</div>
    <img class="qr" src="${url}" ${vq ? `data-vq="${esc(vq)}"` : ""} alt="Mã QR chuyển khoản ${money(amount)}">${MOBILE_OS ? `<button class="ghost plain" data-saveqr>${I("down", "sm")} Lưu ảnh QR</button>` : ""}${rows}</div>`;
}
function showPay() {
  const s = state.data.session, sub = cartSubsidy(), total = cartTotal() - sub;
  if (!s.bank || !s.account) return;
  $("#payCard")?.remove();
  const mine = state.data.orders.filter(o => o.phone === state.user.phone);
  const done = !mine.length ? "" : mine.every(o => o.paid) ? "✓ Người đặt đã xác nhận" : mine.every(o => o.claimed) ? "Đã báo chuyển – chờ người đặt xác nhận" : "";
  const box = document.createElement("div");
  box.className = "card"; box.id = "payCard";
  box.innerHTML = payBoxHtml(s, total)
    + (sub ? `<div class="mute center mt2">Tiền món ${money(total + sub)} − Deeyu hỗ trợ ${money(sub)}</div>` : "")
    + (done ? `<div class="tag ${/^✓/.test(done) ? "ok" : "info"} mt3" style="display:flex;justify-content:center;padding:8px">${done}</div>` : `<button class="primary" id="claimBtn">${I("check", "sm")} Tôi đã chuyển khoản</button>`);
  $("#panel").prepend(box);
  paintQrs();
  if ($("#claimBtn")) $("#claimBtn").onclick = claimPaid;
